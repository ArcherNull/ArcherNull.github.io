<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="本地 WebAssembly 高保真图片压缩（OxiPNG / MozJPEG / WebP），文件不会上传到服务器。" />
  <title>图片智能压缩</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --accent: #2563eb;
      --good: #059669;
      --page-bg: #f1f5f9;
      --card: #ffffff;
      --radius: 16px;
      --font: "Plus Jakarta Sans", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: var(--font);
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 50% at 10% -10%, rgba(37, 99, 235, 0.08), transparent 55%),
        radial-gradient(ellipse 60% 40% at 100% 0%, rgba(16, 185, 129, 0.06), transparent 50%),
        linear-gradient(180deg, #f8fafc 0%, var(--page-bg) 100%);
    }

    body {
      padding: 28px 20px 48px;
    }

    .page {
      max-width: 960px;
      margin: 0 auto;
      display: grid;
      gap: 16px;
    }

    .page-header {
      display: grid;
      gap: 6px;
      animation: fadeUp 0.45s ease both;
    }

    .page-title {
      margin: 0;
      font-size: clamp(22px, 3vw, 28px);
      font-weight: 800;
      letter-spacing: -0.03em;
      color: #111827;
    }

    .page-subtitle {
      margin: 0;
      font-size: 14px;
      line-height: 1.65;
      color: var(--muted);
      max-width: 860px;
    }

    /* Upload */
    .upload-zone {
      border: 2px dashed #cfd8e3;
      border-radius: 12px;
      padding: 28px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s ease, background 0.2s ease, transform 0.2s ease;
      background: var(--card);
      animation: fadeUp 0.5s ease 0.05s both;
    }

    .upload-zone:hover,
    .upload-zone.dragover {
      border-color: var(--accent);
      background: rgba(37, 99, 235, 0.04);
    }

    .upload-zone.dragover {
      transform: scale(1.01);
    }

    .upload-icon {
      width: 42px;
      height: 42px;
      margin: 0 auto 8px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      line-height: 1;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
    }

    .upload-text {
      font-size: 15px;
      font-weight: 600;
      color: #1f2937;
    }

    .upload-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
      line-height: 1.5;
    }

    .upload-input { display: none; }

    /* Stats */
    .stats-panel {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 20px 22px 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--card);
      overflow: hidden;
      box-shadow:
        0 1px 0 rgba(15, 23, 42, 0.03),
        0 12px 32px rgba(15, 23, 42, 0.05);
      flex-wrap: wrap;
      animation: fadeUp 0.4s ease both;
    }

    .stats-glow {
      position: absolute;
      inset: auto -40px -60px auto;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(37, 99, 235, 0.1) 0%, transparent 68%);
      pointer-events: none;
    }

    .stats-main {
      display: flex;
      align-items: center;
      gap: 22px;
      min-width: 0;
      flex: 1;
      position: relative;
      z-index: 1;
    }

    .ratio-ring {
      position: relative;
      width: 96px;
      height: 96px;
      flex-shrink: 0;
    }

    .ring-svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .ring-track,
    .ring-progress {
      fill: none;
      stroke-width: 8;
    }

    .ring-track { stroke: #eef2f7; }

    .ring-progress {
      stroke: #10b981;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .ratio-center {
      position: absolute;
      inset: 0;
      display: grid;
      place-content: center;
      text-align: center;
      gap: 2px;
    }

    .ratio-value {
      font-size: 22px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.03em;
      color: var(--good);
      font-variant-numeric: tabular-nums;
    }

    .ratio-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    .stats-metrics {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      min-width: 0;
      flex: 1;
    }

    .metric-card {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      min-width: 0;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid #eef2f7;
      background: linear-gradient(180deg, #fafbfc 0%, #f5f7fa 100%);
      transition: border-color 0.2s ease, transform 0.2s ease;
    }

    .metric-card:hover {
      border-color: #dbe4f0;
      transform: translateY(-1px);
    }

    .metric-card--saved {
      background: linear-gradient(180deg, #f0fdf6 0%, #ecfdf5 100%);
      border-color: #d1fae5;
    }

    .metric-icon {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .metric-icon--count {
      background: rgba(37, 99, 235, 0.1);
      color: var(--accent);
    }

    .metric-icon--size {
      background: rgba(15, 23, 42, 0.06);
      color: #334155;
    }

    .metric-icon--saved {
      background: rgba(5, 150, 105, 0.12);
      color: var(--good);
    }

    .metric-body {
      display: grid;
      gap: 2px;
      min-width: 0;
    }

    .metric-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    .metric-value {
      font-size: 17px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.2;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .metric-value em {
      font-style: normal;
      font-weight: 500;
      color: #94a3b8;
      font-size: 13px;
    }

    .metric-value--accent { color: var(--good); }

    .metric-sub {
      font-size: 11px;
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .stats-action {
      position: relative;
      z-index: 1;
      flex-shrink: 0;
    }

    .download-all-btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      min-width: 168px;
      min-height: 56px;
      padding: 10px 16px 10px 14px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(145deg, #1e40af 0%, #2563eb 48%, #3b82f6 100%);
      color: #fff;
      cursor: pointer;
      font-family: inherit;
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.18) inset,
        0 10px 24px rgba(37, 99, 235, 0.28);
      transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease, filter 0.18s ease;
    }

    .download-all-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.22) inset,
        0 14px 28px rgba(37, 99, 235, 0.34);
      filter: brightness(1.04);
    }

    .download-all-btn:disabled {
      opacity: 0.42;
      cursor: not-allowed;
      box-shadow: none;
      filter: grayscale(0.2);
    }

    .btn-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.16);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .btn-text {
      display: grid;
      gap: 2px;
      text-align: left;
    }

    .btn-text strong {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.2;
    }

    .btn-text small {
      font-size: 11px;
      opacity: 0.78;
      font-weight: 500;
    }

    .format-bar {
      position: relative;
      z-index: 1;
      width: 100%;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px 18px;
      margin-top: 2px;
      padding-top: 14px;
      border-top: 1px solid #f1f5f9;
    }

    .format-check {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      cursor: pointer;
      user-select: none;
    }

    .format-check input {
      width: 15px;
      height: 15px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .format-select-wrap {
      display: none;
      align-items: center;
      gap: 8px;
    }

    .format-select-wrap.show { display: inline-flex; }

    .format-select-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
    }

    .format-select {
      min-width: 108px;
      height: 34px;
      padding: 0 10px;
      border: 1px solid #dbe4f0;
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      outline: none;
    }

    .format-select:hover,
    .format-select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .format-hint {
      margin: 0;
      margin-left: auto;
      font-size: 12px;
      color: #94a3b8;
    }

    /* Queue */
    .queue-panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px 18px 18px;
      box-shadow:
        0 1px 0 rgba(15, 23, 42, 0.03),
        0 12px 32px rgba(15, 23, 42, 0.05);
      animation: fadeUp 0.45s ease both;
    }

    .queue-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid #f1f5f9;
    }

    .queue-heading {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .queue-title {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      color: var(--ink);
    }

    .queue-count {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      padding: 2px 8px;
      border-radius: 999px;
      background: #f1f5f9;
    }

    .clear-btn {
      min-height: 32px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--muted);
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    .clear-btn:hover {
      background: #f8fafc;
      color: var(--ink);
      border-color: #cbd5e1;
    }

    .queue-list {
      display: grid;
      gap: 10px;
    }

    .queue-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 16px;
      border: 1px solid #e6eef8;
      border-radius: 14px;
      background: #fff;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      animation: fadeUp 0.3s ease both;
    }

    .queue-item.is-compressing {
      border-color: #bfdbfe;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.06);
    }

    .queue-item.is-done { border-color: #bbf7d0; }

    .item-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex: 1;
    }

    .thumb {
      width: 56px;
      height: 56px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid #e5e7eb;
      background: #f8fafc;
      flex-shrink: 0;
    }

    .meta { min-width: 0; }

    .name {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sub {
      margin: 6px 0 0;
      font-size: 12px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot { opacity: 0.5; }

    .item-right {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }

    .progress-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 140px;
    }

    .progress-track {
      width: 110px;
      height: 8px;
      border-radius: 999px;
      background: #e2e8f0;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #38bdf8, #2563eb);
      transition: width 0.25s ease;
      width: 0%;
    }

    .progress-text {
      font-size: 12px;
      color: var(--muted);
      width: 36px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .status-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-text {
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
      min-width: 48px;
    }

    .cancel-btn {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: 1px solid #fecaca;
      background: #fff;
      color: #dc2626;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
    }

    .cancel-btn:hover { background: #fef2f2; }

    .result-info {
      display: grid;
      justify-items: end;
      gap: 2px;
      min-width: 72px;
    }

    .saved {
      font-size: 16px;
      font-weight: 800;
      color: var(--good);
    }

    .size {
      font-size: 12px;
      color: var(--muted);
    }

    .download-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 36px;
      padding: 0 14px;
      border: none;
      border-radius: 10px;
      background: #0f172a;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }

    .download-btn:hover { background: #1e293b; }

    .fmt {
      padding: 2px 6px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.16);
      font-size: 11px;
      letter-spacing: 0.02em;
    }

    .fallback-text {
      font-size: 13px;
      color: #94a3b8;
    }

    .remove-btn {
      min-height: 32px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--muted);
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
    }

    .remove-btn:hover { background: #f8fafc; }

    .hidden { display: none !important; }

    /* Toast */
    .toast-host {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
      display: grid;
      gap: 8px;
      pointer-events: none;
    }

    .toast {
      min-width: 220px;
      max-width: 360px;
      padding: 12px 14px;
      border-radius: 10px;
      background: #0f172a;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.22);
      animation: toastIn 0.25s ease both;
      pointer-events: auto;
    }

    .toast.warn { background: #92400e; }
    .toast.error { background: #991b1b; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateX(12px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @media (max-width: 960px) {
      .stats-metrics { grid-template-columns: 1fr; }
    }

    @media (max-width: 720px) {
      body { padding: 18px 14px 36px; }

      .stats-panel,
      .stats-main {
        flex-direction: column;
        align-items: stretch;
      }

      .ratio-ring { margin: 0 auto; }

      .download-all-btn {
        width: 100%;
        justify-content: center;
      }

      .format-bar {
        flex-direction: column;
        align-items: stretch;
      }

      .format-hint { margin-left: 0; }

      .format-select-wrap.show { width: 100%; }
      .format-select { flex: 1; }

      .queue-item {
        flex-direction: column;
        align-items: stretch;
      }

      .item-right { justify-content: space-between; }

      .progress-wrap {
        flex: 1;
        min-width: 0;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="page-header">
      <h1 class="page-title">图片智能压缩</h1>
      <p class="page-subtitle">
        本地 WebAssembly 高保真压缩（OxiPNG / MozJPEG / WebP），通过 Web Worker
        处理，支持大图且不阻塞页面。文件不会上传到服务器。
      </p>
    </header>

    <div
      id="uploadZone"
      class="upload-zone"
      role="button"
      tabindex="0"
      aria-label="上传图片"
    >
      <div class="upload-icon">+</div>
      <div class="upload-text">点击或拖拽图片到此处</div>
      <div class="upload-sub" id="uploadSub">
        支持 PNG / JPG / WebP / GIF / BMP 等，也可 Ctrl+V 粘贴 · 单次最多 50 张 · 已加入 0 / 50
      </div>
      <input
        id="fileInput"
        type="file"
        class="upload-input"
        accept="image/png,image/jpeg,image/jpg,image/webp,image/gif,image/bmp,image/tiff,image/tif,image/x-icon,image/svg+xml,.png,.jpg,.jpeg,.webp,.gif,.bmp,.tif,.tiff,.ico,.svg"
        multiple
      />
    </div>

    <div id="resultSection" class="hidden">
      <section class="stats-panel">
        <div class="stats-glow" aria-hidden="true"></div>

        <div class="stats-main">
          <div class="ratio-ring">
            <svg class="ring-svg" viewBox="0 0 96 96" aria-hidden="true">
              <circle class="ring-track" cx="48" cy="48" r="40"></circle>
              <circle
                id="ringProgress"
                class="ring-progress"
                cx="48"
                cy="48"
                r="40"
                stroke-dasharray="251.327"
                stroke-dashoffset="251.327"
              ></circle>
            </svg>
            <div class="ratio-center">
              <span class="ratio-value" id="ratioValue">0%</span>
              <span class="ratio-label">已节省</span>
            </div>
          </div>

          <div class="stats-metrics">
            <div class="metric-card">
              <span class="metric-icon metric-icon--count" aria-hidden="true">
                <svg viewBox="0 0 20 20" width="16" height="16">
                  <path fill="currentColor" d="M4 4a2 2 0 0 1 2-2h4.586A2 2 0 0 1 12 2.586L15.414 6A2 2 0 0 1 16 7.414V16a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4Zm7 .414V7h2.586L11 4.414ZM6 9a1 1 0 0 0 0 2h8a1 1 0 1 0 0-2H6Zm0 4a1 1 0 1 0 0 2h5a1 1 0 1 0 0-2H6Z"/>
                </svg>
              </span>
              <div class="metric-body">
                <span class="metric-label">压缩进度</span>
                <span class="metric-value" id="metricProgress">0 <em>/ 0</em></span>
              </div>
            </div>

            <div class="metric-card">
              <span class="metric-icon metric-icon--size" aria-hidden="true">
                <svg viewBox="0 0 20 20" width="16" height="16">
                  <path fill="currentColor" d="M3 4.5A1.5 1.5 0 0 1 4.5 3h11A1.5 1.5 0 0 1 17 4.5v11a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 3 15.5v-11ZM5 6v2h4V6H5Zm6 0v2h4V6h-4ZM5 10v2h10v-2H5Zm0 4v1.5h6V14H5Z"/>
                </svg>
              </span>
              <div class="metric-body">
                <span class="metric-label">压缩后体积</span>
                <span class="metric-value" id="metricCompressed">0 B</span>
                <span class="metric-sub" id="metricOriginal">原体积 0 B</span>
              </div>
            </div>

            <div class="metric-card metric-card--saved">
              <span class="metric-icon metric-icon--saved" aria-hidden="true">
                <svg viewBox="0 0 20 20" width="16" height="16">
                  <path fill="currentColor" d="M10 2a8 8 0 1 0 0 16 8 8 0 0 0 0-16Zm3.707 6.293a1 1 0 0 1 0 1.414l-4 4a1 1 0 0 1-1.414 0l-2-2a1 1 0 1 1 1.414-1.414L9 11.586l3.293-3.293a1 1 0 0 1 1.414 0Z"/>
                </svg>
              </span>
              <div class="metric-body">
                <span class="metric-label">已节省空间</span>
                <span class="metric-value metric-value--accent" id="metricSaved">0 B</span>
                <span class="metric-sub" id="metricAvg">平均单张压缩 0%</span>
              </div>
            </div>
          </div>
        </div>

        <div class="stats-action">
          <button type="button" class="download-all-btn" id="downloadAllBtn" disabled>
            <span class="btn-icon" aria-hidden="true">
              <svg viewBox="0 0 20 20" width="18" height="18">
                <path fill="currentColor" d="M10 2a1 1 0 0 1 1 1v8.586l2.293-2.293a1 1 0 1 1 1.414 1.414l-4 4a1 1 0 0 1-1.414 0l-4-4A1 1 0 0 1 6.707 9.293L9 11.586V3a1 1 0 0 1 1-1Zm-7 13a1 1 0 0 1 1-1h12a1 1 0 1 1 0 2H4a1 1 0 0 1-1-1Z"/>
              </svg>
            </span>
            <span class="btn-text">
              <strong id="downloadAllLabel">下载全部</strong>
              <small id="downloadAllHint">完成压缩后可下载</small>
            </span>
          </button>
        </div>

        <div class="format-bar">
          <label class="format-check">
            <input type="checkbox" id="keepSourceFormat" checked />
            <span>压缩类型与源文件一致</span>
          </label>

          <div class="format-select-wrap" id="formatSelectWrap">
            <span class="format-select-label">输出格式</span>
            <select class="format-select" id="outputFormat">
              <option value="jpg">JPEG</option>
              <option value="png">PNG</option>
              <option value="webp">WebP</option>
            </select>
          </div>

          <p class="format-hint" id="formatHint">
            后续压缩将保持原图格式（JPG / PNG / WebP）
          </p>
        </div>
      </section>

      <section class="queue-panel" style="margin-top: 16px;">
        <div class="queue-header">
          <div class="queue-heading">
            <h2 class="queue-title">压缩队列</h2>
            <span class="queue-count" id="queueCount">0 张</span>
          </div>
          <button type="button" class="clear-btn" id="clearAllBtn">清空</button>
        </div>
        <div class="queue-list" id="queueList"></div>
      </section>
    </div>
  </div>

  <div class="toast-host" id="toastHost" aria-live="polite"></div>

  <script type="module">
    import {
      ZipWriter,
      BlobWriter,
      BlobReader,
    } from "https://cdn.jsdelivr.net/npm/@zip.js/zip.js@2.8.26/+esm";

    const MAX_FILES = 50;
    const LARGE_FILE_BYTES = 8 * 1024 * 1024;
    const RING_CIRC = 2 * Math.PI * 40;
    const IMAGE_EXT_RE =
      /\.(png|jpe?g|webp|gif|bmp|tiff?|ico|svg)$/i;

    const STATUS = {
      waiting: "waiting",
      compressing: "compressing",
      done: "done",
      error: "error",
      cancelled: "cancelled",
    };

    const state = {
      items: [],
      zipping: false,
      keepSourceFormat: true,
      outputFormat: "jpg",
      seed: 0,
    };

    /** @type {Worker[]} */
    const workers = [];
    const busyMap = new Map();
    const progressTimers = new Map();
    const maxWorkers = Math.max(
      1,
      Math.min(2, (navigator.hardwareConcurrency || 4) - 1),
    );

    const els = {
      uploadZone: document.getElementById("uploadZone"),
      fileInput: document.getElementById("fileInput"),
      uploadSub: document.getElementById("uploadSub"),
      resultSection: document.getElementById("resultSection"),
      ringProgress: document.getElementById("ringProgress"),
      ratioValue: document.getElementById("ratioValue"),
      metricProgress: document.getElementById("metricProgress"),
      metricCompressed: document.getElementById("metricCompressed"),
      metricOriginal: document.getElementById("metricOriginal"),
      metricSaved: document.getElementById("metricSaved"),
      metricAvg: document.getElementById("metricAvg"),
      downloadAllBtn: document.getElementById("downloadAllBtn"),
      downloadAllLabel: document.getElementById("downloadAllLabel"),
      downloadAllHint: document.getElementById("downloadAllHint"),
      keepSourceFormat: document.getElementById("keepSourceFormat"),
      formatSelectWrap: document.getElementById("formatSelectWrap"),
      outputFormat: document.getElementById("outputFormat"),
      formatHint: document.getElementById("formatHint"),
      queueCount: document.getElementById("queueCount"),
      queueList: document.getElementById("queueList"),
      clearAllBtn: document.getElementById("clearAllBtn"),
      toastHost: document.getElementById("toastHost"),
    };

    function formatFileSize(bytes) {
      if (!bytes && bytes !== 0) return "-";
      if (bytes === 0) return "0 B";
      const k = 1024;
      const sizes = ["B", "KB", "MB", "GB"];
      const i = Math.min(
        Math.floor(Math.log(bytes) / Math.log(k)),
        sizes.length - 1,
      );
      const value = bytes / Math.pow(k, i);
      return `${value >= 100 ? value.toFixed(0) : value.toFixed(value >= 10 ? 1 : 2)} ${sizes[i]}`;
    }

    function getImageTypeLabel(file) {
      const mime = (file?.type || "").toLowerCase();
      const map = {
        "image/png": "PNG",
        "image/jpeg": "JPEG",
        "image/jpg": "JPEG",
        "image/webp": "WebP",
        "image/gif": "GIF",
        "image/bmp": "BMP",
        "image/tiff": "TIFF",
        "image/tif": "TIFF",
        "image/x-icon": "ICO",
        "image/svg+xml": "SVG",
      };
      if (mime && map[mime]) return map[mime];
      const ext = file?.name?.split(".").pop()?.toUpperCase();
      return ext || "IMAGE";
    }

    function getExtFromMime(mimeType, fallback = "bin") {
      const map = {
        "image/png": "png",
        "image/jpeg": "jpg",
        "image/jpg": "jpg",
        "image/webp": "webp",
        "image/gif": "gif",
        "image/bmp": "bmp",
        "image/tiff": "tiff",
        "image/svg+xml": "svg",
      };
      return map[(mimeType || "").toLowerCase()] || fallback;
    }

    function buildDownloadName(originalName, ext) {
      const base = (originalName || "image").replace(/\.[^.]+$/, "");
      const safeExt = (ext || "bin").replace(/^\./, "");
      return `${base}.${safeExt}`;
    }

    function calcSavedRatio(originalSize, compressedSize) {
      if (!originalSize) return 0;
      const saved = Math.max(0, originalSize - compressedSize);
      return Math.round((saved / originalSize) * 1000) / 10;
    }

    function isImageFile(file) {
      if (!file) return false;
      if (file.type && file.type.startsWith("image/")) return true;
      return IMAGE_EXT_RE.test(file.name || "");
    }

    function triggerBlobDownload(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.rel = "noopener";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1500);
    }

    function toast(message, type = "warn") {
      const el = document.createElement("div");
      el.className = `toast ${type}`;
      el.textContent = message;
      els.toastHost.appendChild(el);
      setTimeout(() => {
        el.style.opacity = "0";
        el.style.transition = "opacity 0.25s ease";
        setTimeout(() => el.remove(), 280);
      }, 2800);
    }

    function createItem(file) {
      return {
        id: `img-${Date.now()}-${++state.seed}`,
        file,
        name: file.name,
        typeLabel: getImageTypeLabel(file),
        originalSize: file.size,
        previewUrl: URL.createObjectURL(file),
        status: STATUS.waiting,
        progress: 0,
        compressedSize: 0,
        compressedBlob: null,
        compressedExt: "",
        compressedMime: "",
        errorMessage: "",
        savedRatio: 0,
      };
    }

    function successItems() {
      return state.items.filter(
        (item) => item.status === STATUS.done && item.compressedBlob,
      );
    }

    function ensureWorkers() {
      while (workers.length < maxWorkers) {
        const worker = new Worker(
          new URL("./compress.worker.js", import.meta.url),
          { type: "module" },
        );
        worker.onmessage = (event) => handleWorkerMessage(worker, event.data);
        worker.onerror = (err) => {
          console.error("[compress-worker]", err);
        };
        workers.push(worker);
      }
    }

    function clearProgressTimer(id) {
      const timer = progressTimers.get(id);
      if (timer) {
        clearInterval(timer);
        progressTimers.delete(id);
      }
    }

    function startFakeProgress(item) {
      clearProgressTimer(item.id);
      item.progress = Math.max(item.progress, 5);
      updateItemDom(item);
      const timer = setInterval(() => {
        if (item.status !== STATUS.compressing) {
          clearProgressTimer(item.id);
          return;
        }
        if (item.progress < 90) {
          item.progress = Math.min(90, item.progress + Math.random() * 6 + 1);
          updateItemDom(item);
        }
      }, 280);
      progressTimers.set(item.id, timer);
    }

    function releaseWorker(worker) {
      for (const [id, w] of busyMap.entries()) {
        if (w === worker) busyMap.delete(id);
      }
    }

    function handleWorkerMessage(worker, data) {
      if (!data?.id) return;
      const item = state.items.find((row) => row.id === data.id);
      if (!item) {
        releaseWorker(worker);
        pumpQueue();
        return;
      }

      if (data.type === "progress") {
        item.progress = Math.max(item.progress, data.progress || 0);
        updateItemDom(item);
        return;
      }

      if (data.type === "cancelled") {
        clearProgressTimer(item.id);
        releaseWorker(worker);
        item.status = STATUS.cancelled;
        item.progress = 0;
        updateItemDom(item);
        updateStats();
        pumpQueue();
        return;
      }

      if (data.type === "error") {
        clearProgressTimer(item.id);
        releaseWorker(worker);
        item.status = STATUS.error;
        item.progress = 0;
        item.errorMessage = data.message || "压缩失败";
        updateItemDom(item);
        updateStats();
        pumpQueue();
        return;
      }

      if (data.type === "done") {
        clearProgressTimer(item.id);
        releaseWorker(worker);

        if (item.status === STATUS.cancelled) {
          pumpQueue();
          return;
        }

        const mime = data.mimeType || item.file.type || "application/octet-stream";
        const ext =
          data.ext ||
          getExtFromMime(mime, item.name.split(".").pop() || "bin");
        const blob = new Blob([data.buffer], { type: mime });

        item.compressedBlob = blob;
        item.compressedSize = data.compressedSize ?? blob.size;
        item.compressedMime = mime;
        item.compressedExt = ext;
        item.savedRatio = calcSavedRatio(item.originalSize, item.compressedSize);
        item.progress = 100;
        item.status = STATUS.done;
        updateItemDom(item);
        updateStats();
        pumpQueue();
      }
    }

    function pumpQueue() {
      ensureWorkers();
      const idleWorkers = workers.filter(
        (w) => ![...busyMap.values()].includes(w),
      );
      if (!idleWorkers.length) return;

      const busyItems = state.items.filter((item) => busyMap.has(item.id));
      const hasLargeBusy = busyItems.some(
        (item) => item.originalSize >= LARGE_FILE_BYTES,
      );
      if (hasLargeBusy) return;

      const waiting = state.items.filter(
        (item) => item.status === STATUS.waiting,
      );
      for (const worker of idleWorkers) {
        const next = waiting.shift();
        if (!next) break;

        if (next.originalSize >= LARGE_FILE_BYTES && busyMap.size > 0) {
          waiting.unshift(next);
          break;
        }

        next.status = STATUS.compressing;
        next.progress = 3;
        next.errorMessage = "";
        busyMap.set(next.id, worker);
        startFakeProgress(next);
        updateItemDom(next);

        next.file
          .arrayBuffer()
          .then((buffer) => {
            if (next.status === STATUS.cancelled) {
              releaseWorker(worker);
              pumpQueue();
              return;
            }
            worker.postMessage(
              {
                type: "compress",
                id: next.id,
                buffer,
                mimeType: next.file.type,
                fileName: next.name,
                keepSourceFormat: state.keepSourceFormat,
                outputFormat: state.keepSourceFormat
                  ? null
                  : state.outputFormat,
              },
              [buffer],
            );
          })
          .catch((err) => {
            clearProgressTimer(next.id);
            releaseWorker(worker);
            next.status = STATUS.error;
            next.errorMessage = err?.message || "读取文件失败";
            updateItemDom(next);
            updateStats();
            pumpQueue();
          });
      }
    }

    function addFiles(fileList) {
      const files = Array.from(fileList || []).filter(Boolean);
      if (!files.length) return;

      const remain = MAX_FILES - state.items.length;
      if (remain <= 0) {
        toast(`最多只能上传 ${MAX_FILES} 张图片`);
        return;
      }

      const accepted = [];
      let skippedNonImage = 0;

      for (const file of files) {
        if (accepted.length >= remain) break;
        if (!isImageFile(file)) {
          skippedNonImage += 1;
          continue;
        }
        accepted.push(file);
      }

      if (files.length > remain) {
        toast(`一次最多 ${MAX_FILES} 张，已截取前 ${remain} 张`);
      }
      if (skippedNonImage) {
        toast(`已忽略 ${skippedNonImage} 个非图片文件`);
      }
      if (!accepted.length) return;

      const newItems = accepted.map(createItem);
      state.items.push(...newItems);
      for (const item of newItems) appendItemDom(item);
      updateStats();
      pumpQueue();
    }

    function cancelItem(id) {
      const item = state.items.find((row) => row.id === id);
      if (!item) return;
      if (
        item.status !== STATUS.waiting &&
        item.status !== STATUS.compressing
      ) {
        return;
      }

      clearProgressTimer(id);
      const worker = busyMap.get(id);
      if (worker) {
        worker.postMessage({ type: "cancel", id });
        try {
          worker.terminate();
        } catch {
          /* ignore */
        }
        const idx = workers.indexOf(worker);
        if (idx >= 0) workers.splice(idx, 1);
        busyMap.delete(id);
        ensureWorkers();
      }

      item.status = STATUS.cancelled;
      item.progress = 0;
      updateItemDom(item);
      updateStats();
      pumpQueue();
    }

    function removeItem(id) {
      const index = state.items.findIndex((row) => row.id === id);
      if (index < 0) return;
      const item = state.items[index];
      if (
        item.status === STATUS.waiting ||
        item.status === STATUS.compressing
      ) {
        cancelItem(id);
      }
      if (item.previewUrl) URL.revokeObjectURL(item.previewUrl);
      state.items.splice(index, 1);
      document.getElementById(`item-${id}`)?.remove();
      updateStats();
    }

    function downloadItem(item) {
      if (!item?.compressedBlob) return;
      const filename = buildDownloadName(item.name, item.compressedExt);
      triggerBlobDownload(item.compressedBlob, filename);
    }

    async function downloadAllZip() {
      const done = successItems();
      if (!done.length) {
        toast("暂无已压缩完成的图片");
        return;
      }
      if (state.zipping) return;
      state.zipping = true;
      updateStats();
      try {
        const zipBlobWriter = new BlobWriter("application/zip");
        const zipWriter = new ZipWriter(zipBlobWriter);
        const usedNames = new Set();

        for (const item of done) {
          let name = buildDownloadName(item.name, item.compressedExt);
          if (usedNames.has(name)) {
            const base = name.replace(/\.[^.]+$/, "");
            const ext = item.compressedExt || "bin";
            let i = 1;
            while (usedNames.has(`${base}(${i}).${ext}`)) i += 1;
            name = `${base}(${i}).${ext}`;
          }
          usedNames.add(name);
          await zipWriter.add(name, new BlobReader(item.compressedBlob));
        }

        await zipWriter.close();
        const zipBlob = await zipBlobWriter.getData();
        triggerBlobDownload(zipBlob, "img.zip");
      } catch (error) {
        toast(`打包失败：${error?.message || "未知错误"}`, "error");
      } finally {
        state.zipping = false;
        updateStats();
      }
    }

    function clearAll() {
      [...state.items].forEach((item) => {
        if (
          item.status === STATUS.waiting ||
          item.status === STATUS.compressing
        ) {
          cancelItem(item.id);
        }
        if (item.previewUrl) URL.revokeObjectURL(item.previewUrl);
      });
      state.items = [];
      els.queueList.innerHTML = "";
      updateStats();
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function appendItemDom(item) {
      const article = document.createElement("article");
      article.className = `queue-item is-${item.status}`;
      article.id = `item-${item.id}`;
      article.innerHTML = `
        <div class="item-left">
          <img class="thumb" src="${item.previewUrl}" alt="${escapeHtml(item.name)}" loading="lazy" />
          <div class="meta">
            <p class="name" title="${escapeHtml(item.name)}">${escapeHtml(item.name)}</p>
            <p class="sub">
              <span>${formatFileSize(item.originalSize)}</span>
              <span class="dot">·</span>
              <span>${item.typeLabel}</span>
            </p>
          </div>
        </div>
        <div class="item-right" data-right></div>
      `;
      els.queueList.appendChild(article);
      updateItemDom(item);
    }

    function updateItemDom(item) {
      const article = document.getElementById(`item-${item.id}`);
      if (!article) return;
      article.className = `queue-item is-${item.status}`;
      const right = article.querySelector("[data-right]");
      if (!right) return;

      if (
        item.status === STATUS.waiting ||
        item.status === STATUS.compressing
      ) {
        const progress =
          item.status === STATUS.waiting
            ? 0
            : Math.round(item.progress || 0);
        right.innerHTML = `
          <div class="progress-wrap">
            <div class="progress-track">
              <div class="progress-bar" style="width:${progress}%"></div>
            </div>
            <span class="progress-text">${progress}%</span>
          </div>
          <div class="status-actions">
            <span class="status-text">${item.status === STATUS.waiting ? "等待中" : "压缩中"}</span>
            <button type="button" class="cancel-btn" title="取消压缩" aria-label="取消压缩" data-action="cancel">
              <svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true">
                <path fill="currentColor" d="M6.28 5.22a.75.75 0 0 0-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 1 0 1.06 1.06L10 11.06l3.72 3.72a.75.75 0 1 0 1.06-1.06L11.06 10l3.72-3.72a.75.75 0 0 0-1.06-1.06L10 8.94 6.28 5.22Z"/>
              </svg>
            </button>
          </div>
        `;
        right.querySelector('[data-action="cancel"]')?.addEventListener(
          "click",
          () => cancelItem(item.id),
        );
        return;
      }

      if (item.status === STATUS.done) {
        right.innerHTML = `
          <div class="result-info">
            <span class="saved">-${item.savedRatio}%</span>
            <span class="size">${formatFileSize(item.compressedSize)}</span>
          </div>
          <button type="button" class="download-btn" data-action="download">
            下载
            <span class="fmt">${(item.compressedExt || "").toUpperCase()}</span>
          </button>
        `;
        right.querySelector('[data-action="download"]')?.addEventListener(
          "click",
          () => downloadItem(item),
        );
        return;
      }

      right.innerHTML = `
        <span class="fallback-text">${
          item.status === STATUS.cancelled
            ? "已取消"
            : escapeHtml(item.errorMessage || "压缩失败")
        }</span>
        <button type="button" class="remove-btn" data-action="remove">移除</button>
      `;
      right.querySelector('[data-action="remove"]')?.addEventListener(
        "click",
        () => removeItem(item.id),
      );
    }

    function updateStats() {
      const total = state.items.length;
      const success = successItems();
      const successCount = success.length;
      const successOriginal = success.reduce(
        (sum, item) => sum + (item.originalSize || 0),
        0,
      );
      const successCompressed = success.reduce(
        (sum, item) => sum + (item.compressedSize || 0),
        0,
      );
      const savedRatio = calcSavedRatio(successOriginal, successCompressed);
      const savedBytes = Math.max(0, successOriginal - successCompressed);
      const displayRatio = Math.max(
        0,
        Math.min(100, Math.round(savedRatio * 10) / 10),
      );

      els.resultSection.classList.toggle("hidden", total === 0);
      els.uploadSub.textContent = `支持 PNG / JPG / WebP / GIF / BMP 等，也可 Ctrl+V 粘贴 · 单次最多 ${MAX_FILES} 张 · 已加入 ${total} / ${MAX_FILES}`;
      els.queueCount.textContent = `${total} 张`;

      els.ratioValue.textContent = `${displayRatio}%`;
      els.ringProgress.setAttribute(
        "stroke-dashoffset",
        String(RING_CIRC * (1 - displayRatio / 100)),
      );
      els.metricProgress.innerHTML = `${successCount} <em>/ ${total}</em>`;
      els.metricCompressed.textContent = formatFileSize(successCompressed);
      els.metricOriginal.textContent = `原体积 ${formatFileSize(successOriginal)}`;
      els.metricSaved.textContent = formatFileSize(savedBytes);
      els.metricAvg.textContent = `平均单张压缩 ${displayRatio}%`;

      const canDownload = successCount > 0;
      els.downloadAllBtn.disabled = !canDownload || state.zipping;
      els.downloadAllLabel.textContent = state.zipping
        ? "正在打包…"
        : "下载全部";
      els.downloadAllHint.textContent = canDownload
        ? "打包为 img.zip"
        : "完成压缩后可下载";

      els.formatSelectWrap.classList.toggle("show", !state.keepSourceFormat);
      const formatLabels = { jpg: "JPEG", png: "PNG", webp: "WebP" };
      els.formatHint.textContent = state.keepSourceFormat
        ? "后续压缩将保持原图格式（JPG / PNG / WebP）"
        : `后续上传将统一输出为 ${formatLabels[state.outputFormat] || state.outputFormat.toUpperCase()}`;
    }

    /* Upload interactions */
    let dragDepth = 0;

    els.uploadZone.addEventListener("click", () => els.fileInput.click());
    els.uploadZone.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        els.fileInput.click();
      }
    });

    els.uploadZone.addEventListener("dragenter", (e) => {
      e.preventDefault();
      dragDepth += 1;
      els.uploadZone.classList.add("dragover");
    });
    els.uploadZone.addEventListener("dragover", (e) => {
      e.preventDefault();
      els.uploadZone.classList.add("dragover");
    });
    els.uploadZone.addEventListener("dragleave", (e) => {
      e.preventDefault();
      dragDepth = Math.max(0, dragDepth - 1);
      if (dragDepth === 0) els.uploadZone.classList.remove("dragover");
    });
    els.uploadZone.addEventListener("drop", (e) => {
      e.preventDefault();
      dragDepth = 0;
      els.uploadZone.classList.remove("dragover");
      if (e.dataTransfer?.files?.length) addFiles(e.dataTransfer.files);
    });

    els.fileInput.addEventListener("change", () => {
      if (els.fileInput.files?.length) addFiles(els.fileInput.files);
      els.fileInput.value = "";
    });

    function collectPasteFiles(clipboardData) {
      if (!clipboardData) return [];
      const fromFiles = Array.from(clipboardData.files || []).filter(
        isImageFile,
      );
      if (fromFiles.length) return fromFiles;
      const fromItems = [];
      for (const item of clipboardData.items || []) {
        if (item.kind !== "file") continue;
        const file = item.getAsFile();
        if (file && isImageFile(file)) fromItems.push(file);
      }
      return fromItems;
    }

    document.addEventListener("paste", (event) => {
      const files = collectPasteFiles(event.clipboardData);
      if (!files.length) return;
      event.preventDefault();
      addFiles(files);
    });

    els.keepSourceFormat.addEventListener("change", () => {
      state.keepSourceFormat = els.keepSourceFormat.checked;
      updateStats();
    });

    els.outputFormat.addEventListener("change", () => {
      state.outputFormat = els.outputFormat.value;
      updateStats();
    });

    els.downloadAllBtn.addEventListener("click", () => downloadAllZip());
    els.clearAllBtn.addEventListener("click", () => clearAll());

    window.addEventListener("beforeunload", () => {
      progressTimers.forEach((timer) => clearInterval(timer));
      progressTimers.clear();
      workers.forEach((w) => {
        try {
          w.terminate();
        } catch {
          /* ignore */
        }
      });
      state.items.forEach((item) => {
        if (item.previewUrl) URL.revokeObjectURL(item.previewUrl);
      });
    });

    updateStats();
  </script>
</body>
</html>
