<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>1 对 1 视频通话 · TRTC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/js-sha256@0.11.0/build/sha256.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
  <!-- 官方 latest/trtc.js 已 404；优先本地 vendor，失败由 ensureTrtcSdk 回退 CDN -->
  <script src="./vendor/trtc.js"></script>
  <style>
    :root {
      --bg: #0e1116;
      --bg-elev: #171b22;
      --bg-soft: #1e2430;
      --line: rgba(255, 255, 255, 0.1);
      --text: #f3f5f7;
      --muted: #9aa3b2;
      --faint: #6b7383;
      --accent: #07c160;
      --accent-dim: rgba(7, 193, 96, 0.16);
      --danger: #fa5151;
      --danger-deep: #c93737;
      --warn: #ffc300;
      --shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      --font: "Noto Sans SC", "IBM Plex Sans", "PingFang SC", sans-serif;
      --font-ui: "IBM Plex Sans", "Noto Sans SC", sans-serif;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-t: env(safe-area-inset-top, 0px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--font);
      color: var(--text);
      background: var(--bg);
      overflow: hidden; /* 通话页禁止整页滚动；大厅在 .lobby 内滚动 */
    }
    button, input { font: inherit; }
    button {
      cursor: pointer;
      border: none;
      background: none;
      color: inherit;
    }
    input {
      width: 100%;
      border: 1px solid var(--line);
      background: rgba(0, 0, 0, 0.28);
      color: var(--text);
      border-radius: 12px;
      padding: 12px 14px;
      outline: none;
      transition: border-color .2s, box-shadow .2s, background .2s;
    }
    input:focus {
      border-color: rgba(7, 193, 96, 0.55);
      box-shadow: 0 0 0 3px var(--accent-dim);
      background: rgba(0, 0, 0, 0.4);
    }
    input::placeholder { color: var(--faint); }
    input:disabled { opacity: 0.55; }
    .hidden { display: none !important; }

    .app {
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    /* ===== Lobby（视立方调试页风格） ===== */
    .lobby {
      height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      padding: calc(24px + var(--safe-t)) 20px calc(32px + var(--safe-b));
      background:
        radial-gradient(700px 380px at 12% -10%, rgba(7, 193, 96, 0.18), transparent 55%),
        radial-gradient(560px 320px at 90% 0%, rgba(80, 120, 255, 0.12), transparent 50%),
        linear-gradient(165deg, #12161d 0%, var(--bg) 48%, #0a0c10 100%);
    }
    .lobby-inner {
      width: min(520px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 18px;
      animation: rise .45s ease both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: none; }
    }
    .hero h1 {
      font-family: var(--font-ui);
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .hero p {
      margin-top: 8px;
      color: var(--muted);
      font-size: .92rem;
      line-height: 1.65;
    }
    .panel {
      background: rgba(23, 27, 34, 0.88);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }
    .panel-title {
      font-family: var(--font-ui);
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--faint);
      margin-bottom: 14px;
    }
    .field { margin-bottom: 12px; }
    .field:last-child { margin-bottom: 0; }
    .field label {
      display: block;
      font-size: .8rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .field .hint {
      margin-top: 6px;
      font-size: .74rem;
      color: var(--faint);
      line-height: 1.45;
    }
    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--line);
      font-size: .8rem;
      font-weight: 600;
      color: var(--muted);
    }
    .status-pill::before {
      content: "";
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--faint);
    }
    .status-pill.ready::before { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
    .status-pill.joining::before { background: var(--warn); }
    .status-pill.error::before { background: var(--danger); }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 48px;
      width: 100%;
      border-radius: 14px;
      font-weight: 700;
      letter-spacing: 0.01em;
      transition: transform .15s, filter .15s, background .2s;
    }
    .btn:active { transform: scale(0.985); }
    .btn-primary {
      background: linear-gradient(135deg, #12d46b, var(--accent));
      color: #04150c;
      box-shadow: 0 10px 28px rgba(7, 193, 96, 0.28);
    }
    .btn-primary:hover { filter: brightness(1.05); }
    .btn-primary:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      filter: none;
    }
    .btn-ghost {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--line);
      color: var(--text);
    }
    .actions { display: grid; gap: 10px; }
    .note {
      font-size: .78rem;
      color: var(--faint);
      line-height: 1.55;
    }
    .note a { color: #7dd3a0; }

    /* ===== Call（微信视频通话） ===== */
    .call {
      height: 100%;
      position: relative;
      background: #0a0a0a;
      overflow: hidden;
    }
    .call-stage {
      position: absolute;
      inset: 0;
      background: #111;
    }
    .wm-layer {
      position: absolute;
      inset: 0;
      z-index: 9;
      pointer-events: none;
      overflow: hidden;
      opacity: 0;
      transition: opacity .25s ease;
    }
    .wm-layer.on { opacity: 1; }
    .wm-layer canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .rec-banner {
      position: absolute;
      top: calc(58px + var(--safe-t));
      left: 50%;
      transform: translateX(-50%);
      z-index: 13;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #fff;
      font-size: .74rem;
      font-weight: 650;
      backdrop-filter: blur(8px);
      pointer-events: none;
    }
    .rec-banner .rec-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff4d4f;
      box-shadow: 0 0 8px rgba(255, 77, 79, 0.7);
      animation: recPulse 1s ease infinite;
    }
    @keyframes recPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    #remote-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #111;
      min-width: 2px;
      min-height: 2px;
    }
    #remote-video > div,
    #remote-video video,
    #remote-video canvas,
    #local-video > div,
    #local-video video,
    #local-video canvas {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      background: #000;
    }

    .remote-placeholder {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 40%, rgba(40, 48, 60, 0.85), transparent 50%),
        linear-gradient(180deg, #1a1f28, #0c0e12);
      transition: opacity .25s ease;
    }
    .remote-placeholder.hide {
      opacity: 0;
      pointer-events: none;
    }
    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      margin: 0 auto 14px;
      font-family: var(--font-ui);
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(145deg, #2a3342, #1a212c);
      border: 2px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.35);
    }
    #remote-avatar {
      width: 64px;
      height: 64px;
      font-size: 1.35rem;
      margin-bottom: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }
    .placeholder-text {
      text-align: center;
      color: var(--muted);
      font-size: .95rem;
      line-height: 1.6;
    }
    .placeholder-text small {
      display: block;
      margin-top: 6px;
      color: var(--faint);
      font-size: .78rem;
    }

    .local-pip {
      position: absolute;
      top: calc(14px + var(--safe-t));
      right: 14px;
      z-index: 8;
      width: min(32vw, 128px);
      aspect-ratio: 3 / 4;
      border-radius: 12px;
      overflow: hidden;
      border: 1.5px solid rgba(255, 255, 255, 0.35);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
      background: #1a1a1a;
      transition: top .25s ease, right .25s ease, width .25s ease, inset .25s ease, border-radius .25s ease;
      animation: pipIn .28s ease-out;
    }
    @keyframes pipIn {
      from { opacity: 0; transform: translateY(-8px) scale(0.96); }
      to { opacity: 1; transform: none; }
    }
    #local-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
      min-width: 2px;
      min-height: 2px;
    }
    .local-empty {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      background: #1a1f28;
      color: var(--muted);
      font-size: .72rem;
      text-align: center;
      padding: 8px;
    }
    .local-empty .avatar {
      width: 44px;
      height: 44px;
      font-size: 1.1rem;
      margin-bottom: 6px;
    }
    .pip-badge {
      position: absolute;
      left: 6px;
      bottom: 6px;
      z-index: 3;
      padding: 3px 7px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.55);
      font-size: .68rem;
      font-weight: 600;
      pointer-events: none;
    }

    /* 点击小窗切换主画面 */
    .call.swapped .call-stage {
      inset: auto;
      top: calc(14px + var(--safe-t));
      right: 14px;
      width: min(32vw, 128px);
      aspect-ratio: 3 / 4;
      border-radius: 12px;
      border: 1.5px solid rgba(255, 255, 255, 0.35);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
      z-index: 8;
      overflow: hidden;
    }
    .call.swapped .local-pip {
      inset: 0;
      width: auto;
      aspect-ratio: auto;
      border: none;
      border-radius: 0;
      box-shadow: none;
      z-index: 1;
      animation: none;
    }
    .call.swapped .remote-placeholder { border-radius: 12px; }

    .call-top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      padding: calc(18px + var(--safe-t)) 20px 40px;
      text-align: center;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.55), transparent);
      pointer-events: none;
    }
    .call-top strong {
      display: block;
      font-size: 1.15rem;
      font-weight: 600;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.45);
    }
    .call-top .call-duration {
      display: block;
      margin-top: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: rgba(255, 255, 255, 0.95);
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.45);
      font-variant-numeric: tabular-nums;
    }
    .call-top.waiting .call-duration {
      color: rgba(255, 255, 255, 0.72);
    }
    .call-top span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
      font-size: .8rem;
      color: rgba(255, 255, 255, 0.78);
    }
    .call-top span::before {
      content: "";
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }
    .call-top.waiting span::before { background: var(--warn); box-shadow: none; }

    .call-bar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 12;
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: center;
      gap: 14px 18px;
      row-gap: 12px;
      padding: 28px 16px calc(28px + var(--safe-b));
      background: linear-gradient(0deg, rgba(0, 0, 0, 0.78), transparent);
    }
    .tool {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(60, 60, 60, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: grid;
      place-items: center;
      color: #fff;
      backdrop-filter: blur(8px);
      transition: background .2s, transform .15s;
    }
    .tool:hover { background: rgba(80, 80, 80, 0.85); }
    .tool:active { transform: scale(0.96); }
    .tool:disabled {
      opacity: 0.45;
      pointer-events: none;
    }
    .tool svg { width: 24px; height: 24px; }
    .tool.off {
      background: rgba(255, 255, 255, 0.92);
      color: #222;
    }
    .tool.hangup {
      background: linear-gradient(145deg, #ff6b6b, var(--danger-deep));
      border: none;
      box-shadow: 0 8px 20px rgba(201, 55, 55, 0.4);
    }
    .tool.hangup:hover {
      filter: brightness(1.06);
      background: linear-gradient(145deg, #ff7a7a, var(--danger-deep));
    }
    .tool-wrap {
      display: grid;
      justify-items: center;
      gap: 8px;
    }
    .tool-wrap label {
      font-size: .68rem;
      color: rgba(255, 255, 255, 0.72);
      pointer-events: none;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(110px + var(--safe-b));
      transform: translateX(-50%) translateY(8px);
      z-index: 40;
      max-width: min(90vw, 360px);
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(20, 24, 30, 0.92);
      border: 1px solid var(--line);
      color: var(--text);
      font-size: .84rem;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: .25s;
      text-align: center;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* 微信式邀请面板 */
    .invite-mask {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(0, 0, 0, 0.55);
      display: grid;
      align-items: end;
      justify-items: center;
      padding: 16px 16px calc(16px + var(--safe-b));
      opacity: 0;
      pointer-events: none;
      transition: opacity .22s ease;
    }
    .invite-mask.show {
      opacity: 1;
      pointer-events: auto;
    }
    .invite-sheet {
      width: min(420px, 100%);
      background: #1c1c1e;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px 18px 16px 16px;
      padding: 18px 18px 14px;
      box-shadow: 0 -8px 40px rgba(0, 0, 0, 0.45);
      transform: translateY(18px);
      transition: transform .22s ease;
    }
    .invite-mask.show .invite-sheet { transform: none; }
    .invite-sheet h2 {
      font-size: 1.05rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 6px;
    }
    .invite-sheet .desc {
      text-align: center;
      color: var(--muted);
      font-size: .8rem;
      line-height: 1.55;
      margin-bottom: 14px;
    }
    .invite-meta {
      display: grid;
      gap: 8px;
      margin-bottom: 12px;
    }
    .invite-meta .row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      font-size: .84rem;
    }
    .invite-meta .row span { color: var(--faint); }
    .invite-meta .row strong {
      font-family: var(--font-ui);
      font-weight: 600;
      word-break: break-all;
      text-align: right;
    }
    .invite-link {
      padding: 12px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--line);
      font-size: .78rem;
      line-height: 1.5;
      color: #b7f0cd;
      word-break: break-all;
      margin-bottom: 14px;
      max-height: 88px;
      overflow: auto;
    }
    .invite-actions {
      display: grid;
      gap: 8px;
    }
    .invite-actions .btn { min-height: 44px; border-radius: 12px; }
    .btn-invite-accent {
      background: rgba(7, 193, 96, 0.16);
      border: 1px solid rgba(7, 193, 96, 0.35);
      color: #7dffa8;
    }
    .call-top-actions {
      position: absolute;
      top: calc(14px + var(--safe-t));
      left: 14px;
      z-index: 11;
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .call-icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      padding: 0;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #fff;
      backdrop-filter: blur(8px);
    }
    .call-icon-btn svg { width: 18px; height: 18px; }
    .call-icon-btn:active { transform: scale(0.97); }

    /* 小程序式 ActionSheet */
    .action-mask {
      position: fixed;
      inset: 0;
      z-index: 55;
      background: rgba(0, 0, 0, 0.5);
      display: grid;
      align-items: end;
      opacity: 0;
      pointer-events: none;
      transition: opacity .22s ease;
    }
    .action-mask.show {
      opacity: 1;
      pointer-events: auto;
    }
    .action-sheet {
      width: 100%;
      padding: 0 10px calc(10px + var(--safe-b));
      transform: translateY(24px);
      transition: transform .22s ease;
    }
    .action-mask.show .action-sheet { transform: none; }
    .action-group {
      overflow: hidden;
      border-radius: 14px;
      background: rgba(40, 40, 42, 0.96);
      backdrop-filter: blur(16px);
      margin-bottom: 8px;
    }
    .action-title {
      padding: 12px 16px 8px;
      text-align: center;
      font-size: .72rem;
      color: var(--faint);
      font-weight: 600;
    }
    .action-item {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      min-height: 52px;
      padding: 12px 16px;
      border: none;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      background: transparent;
      color: #fff;
      font-size: 1rem;
      font-weight: 500;
    }
    .action-item:first-child { border-top: none; }
    .action-item:active { background: rgba(255, 255, 255, 0.06); }
    .action-item .sub {
      display: block;
      width: 100%;
      text-align: center;
      font-size: .72rem;
      color: var(--faint);
      font-weight: 500;
      margin-top: 2px;
    }
    .action-item.stacked {
      flex-direction: column;
      gap: 0;
      min-height: 56px;
    }
    .action-item.active {
      color: var(--accent);
      font-weight: 650;
    }
    .action-item.active .sub { color: #9be7b8; }
    .action-item .check {
      width: 16px;
      color: var(--accent);
      opacity: 0;
      font-size: .9rem;
    }
    .action-item.active .check { opacity: 1; }
    /* 本地录制仅在独立浏览器展示；小程序 web-view 内隐藏 */
    html:not(.env-browser) .browser-only {
      display: none !important;
    }
    .action-cancel {
      width: 100%;
      min-height: 52px;
      border: none;
      border-radius: 14px;
      background: rgba(50, 50, 52, 0.98);
      color: #fff;
      font-size: 1.02rem;
      font-weight: 650;
    }
    .action-cancel:active { background: rgba(70, 70, 74, 0.98); }

    @media (max-width: 560px) {
      .row-2 { grid-template-columns: 1fr; }
      .local-pip,
      .call.swapped .call-stage {
        width: min(34vw, 112px);
        top: calc(10px + var(--safe-t));
        right: 10px;
      }

  </style>
</head>
<body>
  <div class="app" id="app">
    <!-- 调试进房页（对齐视立方 testtool 参数） -->

          </button>

            <svg id="icon-spk-on" viewBox="0 0 24 24" fill="none"><path d="M11 5 6.5 9H3v6h3.5L11 19V5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M15.5 8.5a4.5 4.5 0 0 1 0 7M18.5 6a8 8 0 0 1 0 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <svg id="icon-spk-off" class="hidden" viewBox="0 0 24 24" fill="none"><path d="m3 3 18 18M11 5v4.1L6.5 13H3v-2.2M11 19v-4.3l2-1.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 9.2a4.5 4.5 0 0 1 .8 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>

              <path d="m4 4 16 16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>

  </div>

  <!-- 更多菜单 ActionSheet -->
  <div class="action-mask hidden" id="more-mask" role="dialog" aria-modal="true" aria-label="更多操作">
    <div class="action-sheet">
      <div class="action-group">
        <div class="action-title">更多操作</div>
        <button class="action-item" type="button" id="action-invite">邀请好友</button>
        <button class="action-item" type="button" id="action-watermark">开启全屏水印</button>
        <button class="action-item" type="button" id="action-cloud-record">开始云端录制</button>
        <button class="action-item browser-only" type="button" id="action-record">开始本地录制</button>
      </div>
      <div class="action-group">
        <div class="action-title">画质 / 流畅度</div>
        <button class="action-item stacked" type="button" data-quality="fluent">
          <span><span class="check">✓</span> 流畅</span>
          <span class="sub">480p · 优先流畅</span>
        </button>
        <button class="action-item stacked" type="button" data-quality="hd">
          <span><span class="check">✓</span> 高清</span>
          <span class="sub">720p · 清晰均衡</span>
        </button>
        <button class="action-item stacked active" type="button" data-quality="uhd">
          <span><span class="check">✓</span> 超清</span>
          <span class="sub">1080p · 默认高清</span>
        </button>
      </div>
      <button class="action-cancel" type="button" id="action-cancel">取消</button>
    </div>
  </div>

  <!-- 邀请面板（对齐视立方「复制链接邀请好友」） -->
  <div class="invite-mask hidden" id="invite-mask" role="dialog" aria-modal="true" aria-labelledby="invite-title">
    <div class="invite-sheet">
      <h2 id="invite-title">邀请好友通话</h2>
      <p class="desc">复制链接邀请好友加入视频通话。一条链接建议只发给一人；复制后会刷新邀请码。</p>
      <div class="invite-meta">
        <div class="row"><span>房间号</span><strong id="invite-room">--</strong></div>
        <div class="row"><span>发起人</span><strong id="invite-from">--</strong></div>
      </div>
      <div class="invite-link" id="invite-link-text"></div>
      <div class="invite-actions">
        <button class="btn btn-primary" id="btn-copy-link" type="button">复制邀请链接</button>
        <button class="btn btn-ghost" id="btn-copy-text" type="button">复制邀请文案</button>
        <button class="btn btn-ghost" id="btn-close-invite" type="button">关闭</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
  (() => {
    const TRTC_DEFAULTS = {
      expireTime: 604800,
      defaultRoomId: 8888,
      quality: 'uhd', // 默认超清 1080p
      // 鉴权片段：字段名刻意混淆；前端仍可被逆向，正式环境请服务端签发 UserSig
      _x: '5f60906e',
      _y: 'ZDQxODk4OGY1ZDc0NjRiMTE0MzgzMjY2Y2M4NTZkNmY3ZjQ4YzJhMzhmYzlkNjZkMjMzNWEyYWJkODFiMTBmOA=='
    };

    /** 画质档位：profile 推流分辨率，qos 弱网策略 */
    const QUALITY_PRESETS = {
      fluent: {
        label: '流畅',
        profile: { width: 640, height: 480, frameRate: 20, bitrate: 800 },
        qos: 'smooth'
      },
      hd: {
        label: '高清',
        profile: { width: 1280, height: 720, frameRate: 20, bitrate: 1800 },
        qos: 'clear'
      },
      uhd: {
        label: '超清',
        profile: { width: 1920, height: 1080, frameRate: 20, bitrate: 2800 },
        qos: 'clear'
      }
    };

    const state = {
      trtc: null,
      status: 'idle', // idle | joining | joined | error
      roomId: 0,
      userId: '',
      displayName: '',
      remoteUserId: '',
      micOn: true,
      camOn: true,
      speakerOn: true,
      quality: localStorage.getItem('call.quality') || TRTC_DEFAULTS.quality,
      cameras: [],
      cameraId: '',
      useFrontCamera: true,
      cameraSwitching: false,
      startedRemoteKeys: new Set(),
      speakerMutedRef: false,
      inviteToken: '',
      watermarkOn: localStorage.getItem('call.watermark') === '1',
      recording: false,
      cloudRecording: false,
      cloudSwitching: false,
      userDefineRecordId: '',
      mediaRecorder: null,
      recordChunks: [],
      recordRaf: 0,
      recordTimer: null,
      recordStartedAt: 0,
      recordAudioCtx: null,
      recordMicStream: null,
      wmRaf: 0,
      isBrowser: true,
      callStartedAt: 0,
      callDurationTimer: null
    };

    const $ = (id) => document.getElementById(id);

    function toast(msg) {
      const el = $('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.remove('show'), 2400);
    }

    function randomUserId() {
      return `user_${Math.floor(Math.random() * 100000)}`;
    }

    function randomInviteToken() {
      return Math.random().toString(36).slice(2, 8);
    }

    function currentRoomId() {
      if (state.status === 'joined' || state.status === 'joining') return Number(state.roomId) || 0;
      return Number(String($('room-id').value || '').trim()) || 0;
    }

    /** 解析内置鉴权片段（避免明文 sdkAppId / secretKey 字段名） */
    function resolveAuthBundle() {
      const app = parseInt(String(TRTC_DEFAULTS._x || ''), 16) || 0;
      let seed = '';
      try {
        seed = atob(String(TRTC_DEFAULTS._y || ''));
      } catch {
        seed = '';
      }
      return { app, seed: String(seed || '').trim() };
    }

    function currentFromName() {
      if (state.status === 'joined' || state.status === 'joining') {
        return state.displayName || state.userId || '好友';
      }
      return String($('display-name').value || '').trim()
        || String($('user-id').value || '').trim()
        || '好友';
    }

    function buildInviteLink(token) {
      const roomId = currentRoomId();
      const url = new URL(location.href);
      url.search = '';
      url.hash = '';
      url.searchParams.set('room', String(roomId));
      url.searchParams.set('from', currentFromName());
      url.searchParams.set('invite', token || state.inviteToken || randomInviteToken());
      return url.toString();
    }

    function buildInviteText(link) {
      const roomId = currentRoomId();
      const from = currentFromName();
      return [
        `${from} 邀请你加入 1 对 1 视频通话`,
        `房间号：${roomId}`,
        `点击链接进入：${link}`,
        '打开后将自动填好房间号，确认名称后点击「进入房间」即可。'
      ].join('\n');
    }

    function refreshInvitePanel() {
      if (!state.inviteToken) state.inviteToken = randomInviteToken();
      const link = buildInviteLink(state.inviteToken);
      $('invite-room').textContent = String(currentRoomId() || '--');
      $('invite-from').textContent = currentFromName();
      $('invite-link-text').textContent = link;
      return link;
    }

    function openInvitePanel() {
      const roomId = currentRoomId();
      if (!roomId || roomId <= 0) {
        toast('请先填写有效的 RoomId');
        return;
      }
      if (!state.inviteToken) state.inviteToken = randomInviteToken();
      refreshInvitePanel();
      const mask = $('invite-mask');
      mask.classList.remove('hidden');
      requestAnimationFrame(() => mask.classList.add('show'));
    }

    function closeInvitePanel() {
      const mask = $('invite-mask');
      mask.classList.remove('show');
      setTimeout(() => mask.classList.add('hidden'), 220);
    }

    async function copyText(text, okMsg) {
      try {
        await navigator.clipboard.writeText(text);
        toast(okMsg);
      } catch {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
        toast(okMsg);
      }
    }

    async function copyInviteLink() {
      const link = refreshInvitePanel();
      await copyText(link, '邀请链接已复制');
      // 对齐视立方：复制后自动更新链接/邀请码
      state.inviteToken = randomInviteToken();
      refreshInvitePanel();
    }

    async function copyInviteMessage() {
      const link = refreshInvitePanel();
      await copyText(buildInviteText(link), '邀请文案已复制');
      state.inviteToken = randomInviteToken();
      refreshInvitePanel();
    }

    function loadForm() {
      $('user-id').value = localStorage.getItem('call.userId') || randomUserId();
      $('room-id').value = localStorage.getItem('call.roomId') || String(TRTC_DEFAULTS.defaultRoomId);
      $('display-name').value = localStorage.getItem('call.displayName') || '';
    }

    /**
     * 从 URL 回填入会参数（邀请链接 / 小程序表单）。
     * 支持：room|roomId、userId、displayName|userName、from、invite、autostart
     * SDKAppId / SecretKey 固定使用页面内置配置，不从 URL 或表单读取。
     * @returns {{ applied: boolean, autostart: boolean }}
     */
    function applyInviteFromUrl() {
      const params = new URLSearchParams(location.search);
      const room = params.get('room') || params.get('roomId') || '';
      const from = params.get('from') || '';
      const invite = params.get('invite') || '';
      const userId = params.get('userId') || params.get('userid') || '';
      const displayName =
        params.get('displayName') || params.get('userName') || params.get('name') || '';
      const autostart = ['1', 'true', 'yes'].includes(
        String(params.get('autostart') || '').toLowerCase()
      );

      if (!room && !invite && !userId && !displayName && !autostart) {
        return { applied: false, autostart: false };
      }

      if (room) $('room-id').value = String(room).replace(/\D/g, '');

      if (userId) {
        $('user-id').value = String(userId).trim();
      } else if (invite) {
        // 纯邀请链接未指定本端 UserId 时，随机生成以免与发起人冲突
        $('user-id').value = randomUserId();
      }

      if (displayName) {
        $('display-name').value = String(displayName).trim().slice(0, 16);
      } else if (invite && !String($('display-name').value || '').trim()) {
        $('display-name').value = '访客';
      }

      if (room || invite) {
        setStatusText(
          from
            ? `${from} 邀请你加入房间 ${$('room-id').value}。确认名称后点击「进入房间」。`
            : `已通过链接填好房间 ${$('room-id').value}。确认名称后点击「进入房间」。`
        );
        if (!autostart) {
          toast(from ? `${from} 邀请你通话` : '已填入邀请房间号');
        }
      }

      history.replaceState({}, '', location.pathname);
      return { applied: !!(room || invite || userId || displayName), autostart };
    }

    function saveForm() {
      localStorage.setItem('call.userId', String($('user-id').value || '').trim());
      localStorage.setItem('call.roomId', String($('room-id').value || '').trim());
      localStorage.setItem('call.displayName', String($('display-name').value || '').trim());
    }

    function setLobbyStatus(kind, text) {
      const pill = $('status-pill');
      pill.className = `status-pill ${kind}`;
      pill.textContent = text;
      if (arguments.length > 2 || text) {
        // keep status-text updated by caller
      }
    }

    function setStatusText(text) {
      $('status-text').textContent = text;
    }

    function showScreen(name) {
      $('screen-lobby').classList.toggle('hidden', name !== 'lobby');
      $('screen-call').classList.toggle('hidden', name !== 'call');
      if (name !== 'call') $('screen-call').classList.remove('swapped');
    }

    function setFormLocked(locked) {
      ['user-id', 'room-id', 'display-name'].forEach((id) => {
        $(id).disabled = locked;
      });
      $('btn-enter').disabled = locked || !getTRTC();
      $('btn-random').disabled = locked;
      $('btn-invite-lobby').disabled = false;
    }

    function setMicUi(on) {
      state.micOn = on;
      $('btn-mic').classList.toggle('off', !on);
      $('icon-mic-on').classList.toggle('hidden', !on);
      $('icon-mic-off').classList.toggle('hidden', on);
    }

    function setCamUi(on) {
      state.camOn = on;
      $('btn-cam').classList.toggle('off', !on);
      $('icon-cam-on').classList.toggle('hidden', !on);
      $('icon-cam-off').classList.toggle('hidden', on);
      $('local-empty').classList.toggle('hidden', on);
      $('local-video').classList.toggle('hidden', !on);
    }

    function setSpeakerUi(on) {
      state.speakerOn = on;
      state.speakerMutedRef = !on;
      $('btn-speaker').classList.toggle('off', !on);
      $('icon-spk-on').classList.toggle('hidden', !on);
      $('icon-spk-off').classList.toggle('hidden', on);
    }

    function getQualityPreset(key = state.quality) {
      return QUALITY_PRESETS[key] || QUALITY_PRESETS.uhd;
    }

    function resolveQosPreference(qos) {
      const TYPE = window.TRTC?.TYPE;
      if (!TYPE) return undefined;
      if (qos === 'smooth') return TYPE.QOS_PREFERENCE_SMOOTH;
      return TYPE.QOS_PREFERENCE_CLEAR;
    }

    function isMobileDevice() {
      const ua = navigator.userAgent || '';
      if (/Android|iPhone|iPad|iPod|Mobile|webOS|BlackBerry|IEMobile|Opera Mini/i.test(ua)) {
        return true;
      }
      // iPadOS 桌面 UA
      return navigator.maxTouchPoints > 1 && /Macintosh/i.test(ua);
    }

    function detectFacing(device) {
      try {
        const caps = typeof device.getCapabilities === 'function' ? device.getCapabilities() : null;
        const mode = caps?.facingMode;
        const facing = Array.isArray(mode) ? mode[0] : mode;
        if (facing === 'user' || facing === 'environment') return facing;
      } catch {
        /* ignore */
      }
      const label = String(device.label || '');
      if (/front|user|前置|前摄|前/i.test(label)) return 'user';
      if (/back|rear|environment|后置|后摄|后/i.test(label)) return 'environment';
      return '';
    }

    function getLocalVideoOption() {
      const preset = getQualityPreset();
      const option = {
        fillMode: 'cover',
        // 前置镜像、后置不镜像，符合常见通话体验
        mirror: !!state.useFrontCamera,
        profile: preset.profile
      };
      // 移动端必须用 useFrontCamera；若同时传 cameraId，SDK 会优先 cameraId 导致翻转失败
      if (isMobileDevice()) {
        option.useFrontCamera = state.useFrontCamera;
      } else if (state.cameraId) {
        option.cameraId = state.cameraId;
      } else {
        option.useFrontCamera = state.useFrontCamera;
      }
      const qos = resolveQosPreference(preset.qos);
      if (qos !== undefined) option.qosPreference = qos;
      return option;
    }

    function syncFlipCamUi() {
      const wrap = $('wrap-flip-cam');
      if (!wrap) return;
      // 手机前后摄切换不依赖设备列表数量（enumerate 常只返回 1 个）
      const canFlip =
        state.status === 'joined' &&
        state.camOn &&
        (isMobileDevice() || state.cameras.length > 1);
      wrap.classList.toggle('hidden', !canFlip);
    }

    async function refreshCameras() {
      let list = [];
      try {
        if (window.TRTC?.getCameraList) {
          list = await window.TRTC.getCameraList({ requestPermission: true });
        } else if (navigator.mediaDevices?.enumerateDevices) {
          const devices = await navigator.mediaDevices.enumerateDevices();
          list = devices.filter((d) => d.kind === 'videoinput');
        }
      } catch (e) {
        console.warn('refreshCameras failed', e);
      }

      state.cameras = (list || []).map((d, i) => {
        const facing = detectFacing(d);
        return {
          deviceId: d.deviceId || '',
          label: d.label || (facing === 'user' ? '前置摄像头' : facing === 'environment' ? '后置摄像头' : `摄像头 ${i + 1}`),
          facing
        };
      }).filter((d) => d.deviceId);

      if (state.cameraId && !state.cameras.some((c) => c.deviceId === state.cameraId)) {
        state.cameraId = state.cameras[0]?.deviceId || '';
      }
      if (!state.cameraId && state.cameras.length) {
        const front = state.cameras.find((c) => c.facing === 'user');
        const pick = front || state.cameras[0];
        state.cameraId = pick.deviceId;
        if (pick.facing === 'user') state.useFrontCamera = true;
        else if (pick.facing === 'environment') state.useFrontCamera = false;
        else state.useFrontCamera = Boolean(front) || state.cameras.length === 1;
      }
      syncFlipCamUi();
      return state.cameras;
    }

    function sleep(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    /** 应用摄像头切换；update 失败时 stop→短暂释放→start（兼容部分 Android / 微信内置浏览器） */
    async function applyLocalCameraSwitch() {
      const option = getLocalVideoOption();
      try {
        await state.trtc.updateLocalVideo({ option });
        fitHost($('local-video'));
        return;
      } catch (e) {
        console.warn('updateLocalVideo camera switch failed, restart capture', e);
      }

      const view = await waitForElement('local-video');
      await state.trtc.stopLocalVideo();
      // 部分机型释放摄像头需要短暂间隔，否则 start 会 NotReadableError
      await sleep(isMobileDevice() ? 180 : 80);
      await state.trtc.startLocalVideo({ view, option });
      fitHost(view);
    }

    async function flipCamera() {
      if (!state.trtc || state.status !== 'joined' || !state.camOn || state.cameraSwitching) return;

      const mobile = isMobileDevice();
      if (!mobile) {
        if (state.cameras.length < 2) await refreshCameras();
        if (state.cameras.length < 2) {
          toast('未检测到多个摄像头');
          return;
        }
      }

      state.cameraSwitching = true;
      const btn = $('btn-flip-cam');
      if (btn) btn.disabled = true;

      const prevFront = state.useFrontCamera;
      const prevCameraId = state.cameraId;

      try {
        if (mobile) {
          // 官方推荐：移动端用 useFrontCamera 翻转，不要依赖 cameraId
          state.useFrontCamera = !state.useFrontCamera;
          state.cameraId = '';
          await applyLocalCameraSwitch();
          toast(state.useFrontCamera ? '已切换至前置摄像头' : '已切换至后置摄像头');
        } else {
          const idx = Math.max(0, state.cameras.findIndex((c) => c.deviceId === state.cameraId));
          const next = state.cameras[(idx + 1) % state.cameras.length];
          state.cameraId = next.deviceId;
          if (next.facing === 'user') state.useFrontCamera = true;
          else if (next.facing === 'environment') state.useFrontCamera = false;
          else state.useFrontCamera = /front|user|前置|前/i.test(next.label);
          await applyLocalCameraSwitch();
          toast(`已切换：${next.label}`);
        }
      } catch (err) {
        console.error(err);
        state.useFrontCamera = prevFront;
        state.cameraId = prevCameraId;
        toast('翻转摄像头失败，请重试');
      } finally {
        state.cameraSwitching = false;
        if (btn) btn.disabled = false;
        syncFlipCamUi();
      }
    }

    function syncQualityUi() {
      if (!QUALITY_PRESETS[state.quality]) state.quality = 'uhd';
      document.querySelectorAll('#more-mask [data-quality]').forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.quality === state.quality);
      });
    }

    function syncMoreMenuLabels() {
      const wmBtn = $('action-watermark');
      const cloudBtn = $('action-cloud-record');
      const recBtn = $('action-record');
      if (wmBtn) wmBtn.textContent = state.watermarkOn ? '关闭全屏水印' : '开启全屏水印';
      if (cloudBtn) cloudBtn.textContent = state.cloudRecording ? '停止云端录制' : '开始云端录制';
      if (recBtn) recBtn.textContent = state.recording ? '停止本地录制' : '开始本地录制';
      wmBtn?.classList.toggle('active', state.watermarkOn);
      cloudBtn?.classList.toggle('active', state.cloudRecording);
      recBtn?.classList.toggle('active', state.recording);
    }

    /** 独立浏览器（非微信小程序 web-view）才展示本地录制 */
    function detectBrowserEnv() {
      const ua = navigator.userAgent || '';
      const apply = (isMiniProgram) => {
        state.isBrowser = !isMiniProgram;
        document.documentElement.classList.toggle('env-browser', state.isBrowser);
        document.documentElement.classList.toggle('env-miniprogram', !state.isBrowser);
      };
      // 默认按浏览器展示；确认处于小程序 web-view 后再隐藏本地录制
      apply(/miniProgram/i.test(ua));
      try {
        if (typeof wx !== 'undefined' && wx.miniProgram?.getEnv) {
          wx.miniProgram.getEnv((res) => apply(!!res?.miniprogram));
        }
      } catch {
        /* ignore */
      }
    }

    function makeCloudRecordId() {
      const raw = `call_${state.roomId || 0}_${state.userId || 'u'}_${Date.now().toString(36)}`;
      return String(raw).replace(/[^a-zA-Z0-9_-]/g, '_').slice(0, 64);
    }

    function openMoreMenu() {
      syncQualityUi();
      syncMoreMenuLabels();
      const mask = $('more-mask');
      mask.classList.remove('hidden');
      requestAnimationFrame(() => mask.classList.add('show'));
    }

    function watermarkText() {
      const name = state.displayName || state.userId || '通话';
      const room = state.roomId || '--';
      // 去掉秒，避免文字长短抖动导致间距不稳
      const time = new Date().toLocaleString('zh-CN', {
        hour12: false,
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit'
      });
      return `${name} · ${room} · ${time}`;
    }

    function paintWatermarkTiles(ctx, width, height, fontSize) {
      const text = watermarkText();
      ctx.save();
      ctx.translate(width / 2, height / 2);
      ctx.rotate(-Math.PI / 6);
      ctx.font = `600 ${fontSize}px "Noto Sans SC", "IBM Plex Sans", sans-serif`;
      ctx.fillStyle = 'rgba(255,255,255,0.14)';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const textWidth = Math.ceil(ctx.measureText(text).width);
      // 按实际文字宽度留白，避免斜向平铺重叠
      const stepX = Math.max(textWidth + 72, 260);
      const stepY = Math.max(fontSize * 3.2, 96);
      const span = Math.hypot(width, height) + stepX;
      let row = 0;
      for (let y = -span; y <= span; y += stepY) {
        const offsetX = (row % 2) * (stepX / 2);
        for (let x = -span; x <= span; x += stepX) {
          ctx.fillText(text, x + offsetX, y);
        }
        row += 1;
      }
      ctx.restore();
    }

    function drawWatermarkCanvas() {
      const canvas = $('wm-canvas');
      const layer = $('wm-layer');
      if (!canvas || !layer) return;
      const rect = layer.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const w = Math.max(1, Math.floor(rect.width));
      const h = Math.max(1, Math.floor(rect.height));
      if (canvas.width !== Math.floor(w * dpr) || canvas.height !== Math.floor(h * dpr)) {
        canvas.width = Math.floor(w * dpr);
        canvas.height = Math.floor(h * dpr);
      }
      const ctx = canvas.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, w, h);
      paintWatermarkTiles(ctx, w, h, 15);
    }

    function startWatermarkLoop() {
      stopWatermarkLoop();
      drawWatermarkCanvas();
      // 每分钟刷新一次时间即可，避免每帧重绘造成叠影感
      state.wmRaf = window.setInterval(() => {
        if (!state.watermarkOn) return;
        drawWatermarkCanvas();
      }, 60 * 1000);
    }

    function stopWatermarkLoop() {
      if (state.wmRaf) {
        clearInterval(state.wmRaf);
        state.wmRaf = 0;
      }
    }

    function setWatermarkOn(on) {
      state.watermarkOn = Boolean(on);
      localStorage.setItem('call.watermark', state.watermarkOn ? '1' : '0');
      const layer = $('wm-layer');
      layer?.classList.toggle('on', state.watermarkOn);
      layer?.setAttribute('aria-hidden', state.watermarkOn ? 'false' : 'true');
      if (state.watermarkOn) {
        drawWatermarkCanvas();
        startWatermarkLoop();
      } else {
        stopWatermarkLoop();
      }
      syncMoreMenuLabels();
    }

    function toggleWatermark() {
      setWatermarkOn(!state.watermarkOn);
      toast(state.watermarkOn ? '已开启全屏水印' : '已关闭全屏水印');
      closeMoreMenu();
    }

    function formatRecordDuration(ms) {
      const sec = Math.max(0, Math.floor(ms / 1000));
      const m = String(Math.floor(sec / 60)).padStart(2, '0');
      const s = String(sec % 60).padStart(2, '0');
      return `${m}:${s}`;
    }

    function recordingBannerLabel() {
      if (state.recording && state.cloudRecording) return '本地+云端录制中';
      if (state.cloudRecording) return '云端录制中';
      if (state.recording) return '本地录制中';
      return '录制中';
    }

    function syncRecordingBanner() {
      const on = state.recording || state.cloudRecording;
      const banner = $('rec-banner');
      banner?.classList.toggle('hidden', !on);
      if (!on) {
        clearInterval(state.recordTimer);
        state.recordTimer = null;
        return;
      }
      if (!state.recordTimer) {
        state.recordStartedAt = Date.now();
      }
      const tick = () => {
        $('rec-banner-text').textContent =
          `${recordingBannerLabel()} ${formatRecordDuration(Date.now() - state.recordStartedAt)}`;
      };
      tick();
      clearInterval(state.recordTimer);
      state.recordTimer = setInterval(tick, 500);
    }

    function setRecordingBanner(on) {
      // 兼容旧调用：本地录制启停时刷新横幅
      if (on && !state.recordStartedAt) state.recordStartedAt = Date.now();
      syncRecordingBanner();
    }

    function findStageVideos() {
      const local = $('local-video')?.querySelector('video');
      const remote = $('remote-video')?.querySelector('video');
      return { local, remote };
    }

    function drawWatermarkOnCtx(ctx, width, height) {
      if (!state.watermarkOn) return;
      paintWatermarkTiles(ctx, width, height, 26);
    }

    async function startLocalRecording() {
      if (state.recording) return;
      if (!state.isBrowser) {
        toast('本地录制仅支持浏览器环境');
        return;
      }
      if (state.status !== 'joined') {
        toast('请先进入房间再录制');
        return;
      }
      if (typeof MediaRecorder === 'undefined' || typeof HTMLCanvasElement === 'undefined'
        || typeof HTMLCanvasElement.prototype.captureStream !== 'function') {
        toast('当前浏览器不支持本地录制');
        return;
      }

      const canvas = document.createElement('canvas');
      canvas.width = 1280;
      canvas.height = 720;
      const ctx = canvas.getContext('2d');

      const draw = () => {
        ctx.fillStyle = '#0a0a0a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        const { local, remote } = findStageVideos();
        const main = remote && remote.readyState >= 2 ? remote : local;
        if (main && main.readyState >= 2) {
          ctx.drawImage(main, 0, 0, canvas.width, canvas.height);
        } else {
          ctx.fillStyle = '#9aa3b2';
          ctx.font = '600 28px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(state.displayName || '通话录制', canvas.width / 2, canvas.height / 2);
        }
        if (main === remote && local && local.readyState >= 2) {
          const w = 220;
          const h = 294;
          const x = canvas.width - w - 24;
          const y = 24;
          ctx.save();
          ctx.beginPath();
          if (typeof ctx.roundRect === 'function') ctx.roundRect(x, y, w, h, 12);
          else ctx.rect(x, y, w, h);
          ctx.clip();
          ctx.drawImage(local, x, y, w, h);
          ctx.restore();
          ctx.strokeStyle = 'rgba(255,255,255,0.45)';
          ctx.lineWidth = 3;
          ctx.strokeRect(x, y, w, h);
        }
        drawWatermarkOnCtx(ctx, canvas.width, canvas.height);
        state.recordRaf = requestAnimationFrame(draw);
      };
      draw();

      const videoStream = canvas.captureStream(30);
      const tracks = [...videoStream.getVideoTracks()];

      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        state.recordAudioCtx = audioCtx;
        const dest = audioCtx.createMediaStreamDestination();
        const { local, remote } = findStageVideos();
        const addFromVideo = (video) => {
          if (!video?.srcObject) return;
          try {
            const src = audioCtx.createMediaStreamSource(video.srcObject);
            src.connect(dest);
          } catch {}
        };
        addFromVideo(remote);
        addFromVideo(local);
        try {
          state.recordMicStream = await navigator.mediaDevices.getUserMedia({
            audio: {
              echoCancellation: true,
              noiseSuppression: true,
              autoGainControl: true
            },
            video: false
          });
          const micSrc = audioCtx.createMediaStreamSource(state.recordMicStream);
          micSrc.connect(dest);
        } catch {}
        dest.stream.getAudioTracks().forEach((t) => tracks.push(t));
      } catch (e) {
        console.warn('record audio mix failed', e);
      }

      const mixed = new MediaStream(tracks);
      const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')
        ? 'video/webm;codecs=vp9,opus'
        : (MediaRecorder.isTypeSupported('video/webm;codecs=vp8,opus')
          ? 'video/webm;codecs=vp8,opus'
          : 'video/webm');
      const recorder = new MediaRecorder(mixed, { mimeType: mime, videoBitsPerSecond: 2500000 });
      state.mediaRecorder = recorder;
      state.recordChunks = [];
      recorder.ondataavailable = (e) => {
        if (e.data?.size) state.recordChunks.push(e.data);
      };
      recorder.onstop = () => {
        cancelAnimationFrame(state.recordRaf);
        state.recordRaf = 0;
        try { state.recordAudioCtx?.close(); } catch {}
        state.recordAudioCtx = null;
        state.recordMicStream?.getTracks().forEach((t) => t.stop());
        state.recordMicStream = null;
        mixed.getTracks().forEach((t) => t.stop());
        const blob = new Blob(state.recordChunks, { type: mime });
        state.recordChunks = [];
        if (!blob.size) {
          toast('录制文件为空');
          return;
        }
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `call-${state.roomId || 'local'}-${Date.now()}.webm`;
        a.click();
        URL.revokeObjectURL(a.href);
        toast('本地录制已保存');
      };
      recorder.start(1000);
      state.recording = true;
      syncRecordingBanner();
      syncMoreMenuLabels();
      toast('已开始本地录制');
    }

    async function stopLocalRecording({ silent = false } = {}) {
      if (!state.recording && !state.mediaRecorder) return;
      const recorder = state.mediaRecorder;
      state.mediaRecorder = null;
      state.recording = false;
      syncRecordingBanner();
      syncMoreMenuLabels();
      if (recorder && recorder.state !== 'inactive') {
        await new Promise((resolve) => {
          recorder.addEventListener('stop', resolve, { once: true });
          try { recorder.stop(); } catch { resolve(); }
        });
      } else {
        cancelAnimationFrame(state.recordRaf);
        state.recordRaf = 0;
      }
      if (!silent) toast('已停止本地录制');
    }

    async function toggleLocalRecording() {
      closeMoreMenu();
      if (!state.isBrowser) {
        toast('本地录制仅支持浏览器环境');
        return;
      }
      if (state.recording) await stopLocalRecording();
      else await startLocalRecording();
    }

    async function ensureCloudMix() {
      if (!state.cloudRecording || !state.trtc || state.status !== 'joined') return;
      const trtc = state.trtc;
      const TRTC = getTRTC();
      if (!TRTC || typeof trtc.startMixTranscode !== 'function') return;

      const localId = state.userId;
      const remoteId = state.remoteUserId;
      const W = 1280;
      const H = 720;
      const mixUsers = remoteId
        ? [
            {
              userId: remoteId,
              width: W,
              height: H,
              locationX: 0,
              locationY: 0,
              zOrder: 1,
              pureAudio: false,
              streamType: TRTC.TYPE.STREAM_TYPE_MAIN
            },
            {
              userId: localId,
              width: 320,
              height: 180,
              locationX: W - 320 - 24,
              locationY: H - 180 - 24,
              zOrder: 2,
              pureAudio: false,
              streamType: TRTC.TYPE.STREAM_TYPE_MAIN
            }
          ]
        : [
            {
              userId: localId,
              width: W,
              height: H,
              locationX: 0,
              locationY: 0,
              zOrder: 1,
              pureAudio: false,
              streamType: TRTC.TYPE.STREAM_TYPE_MAIN
            }
          ];

      try {
        await trtc.startMixTranscode({
          mode: 'manual',
          videoWidth: W,
          videoHeight: H,
          videoBitrate: 1500,
          videoFramerate: 15,
          videoGOP: 2,
          audioSampleRate: 48000,
          audioBitrate: 64,
          audioChannels: 1,
          mixUsers
        });
      } catch (e) {
        // 部分应用未开通混流/旧版录制，单流录制仍可继续
        console.warn('startMixTranscode failed', e);
      }
    }

    async function stopCloudMix() {
      if (!state.trtc || typeof state.trtc.stopMixTranscode !== 'function') return;
      try {
        await state.trtc.stopMixTranscode();
      } catch (e) {
        console.warn('stopMixTranscode failed', e);
      }
    }

    async function toggleCloudRecording() {
      closeMoreMenu();
      if (state.status !== 'joined') {
        toast('请先进入房间再云端录制');
        return;
      }
      if (state.cloudSwitching) return;
      state.cloudSwitching = true;
      const enable = !state.cloudRecording;
      try {
        toast(enable ? '正在开启云端录制…' : '正在停止云端录制…');
        // 指定用户录制需在进房时携带 userDefineRecordId，因此通过重进房切换
        await enterRoom({
          rejoin: true,
          cloudRecord: enable
        });
        if (state.status === 'joined') {
          toast(
            enable
              ? '已开启云端录制（需控制台开通「指定用户录制」）'
              : '已停止云端录制，文件稍后写入云存储'
          );
        }
      } catch (e) {
        console.error(e);
        toast(`云端录制失败：${e?.message || e}`);
      } finally {
        state.cloudSwitching = false;
        syncMoreMenuLabels();
        syncRecordingBanner();
      }
    }

    function closeMoreMenu() {
      const mask = $('more-mask');
      mask.classList.remove('show');
      setTimeout(() => mask.classList.add('hidden'), 220);
    }

    async function applyVideoQuality(qualityKey, { silent = false } = {}) {
      if (!QUALITY_PRESETS[qualityKey]) return;
      state.quality = qualityKey;
      localStorage.setItem('call.quality', qualityKey);
      syncQualityUi();
      closeMoreMenu();

      if (!state.trtc || state.status !== 'joined' || !state.camOn) {
        if (!silent) toast(`已选择${getQualityPreset().label}`);
        return;
      }
      try {
        await state.trtc.updateLocalVideo({ option: getLocalVideoOption() });
        if (!silent) toast(`已切换为${getQualityPreset().label}`);
      } catch (e) {
        console.error(e);
        // 部分浏览器不支持动态改 profile，重启本地视频
        try {
          const view = await waitForElement('local-video');
          await state.trtc.stopLocalVideo();
          await state.trtc.startLocalVideo({
            view,
            option: getLocalVideoOption()
          });
          fitHost(view);
          if (!silent) toast(`已切换为${getQualityPreset().label}`);
        } catch (err) {
          console.error(err);
          toast('画质切换失败，设备可能不支持该分辨率');
        }
      }
    }

    function formatCallDuration(ms) {
      const sec = Math.max(0, Math.floor(ms / 1000));
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      const mm = String(m).padStart(2, '0');
      const ss = String(s).padStart(2, '0');
      if (h > 0) return `${String(h).padStart(2, '0')}:${mm}:${ss}`;
      return `${mm}:${ss}`;
    }

    function syncCallDuration() {
      const el = $('call-duration');
      if (!el) return;
      if (!state.callStartedAt || (state.status !== 'joined' && state.status !== 'joining')) {
        el.textContent = '00:00';
        return;
      }
      el.textContent = formatCallDuration(Date.now() - state.callStartedAt);
    }

    function startCallDurationTimer({ reset = false } = {}) {
      if (reset || !state.callStartedAt) state.callStartedAt = Date.now();
      clearInterval(state.callDurationTimer);
      syncCallDuration();
      state.callDurationTimer = setInterval(syncCallDuration, 1000);
    }

    function stopCallDurationTimer() {
      clearInterval(state.callDurationTimer);
      state.callDurationTimer = null;
      state.callStartedAt = 0;
      const el = $('call-duration');
      if (el) el.textContent = '00:00';
    }

    function updateCallHeader() {
      const top = $('call-top');
      if (state.remoteUserId) {
        top.classList.remove('waiting');
        $('call-title').textContent = state.remoteUserId;
        $('call-sub').textContent = `房间 ${state.roomId} · 通话中`;
        $('remote-avatar').textContent = String(state.remoteUserId).slice(0, 1).toUpperCase();
        $('placeholder-sub').textContent = '对方已加入，正在拉取视频…';
      } else {
        top.classList.add('waiting');
        $('call-title').textContent = state.displayName || state.userId || '通话';
        $('call-sub').textContent = `房间 ${state.roomId} · 等待对方`;
        $('remote-avatar').textContent = '?';
        $('placeholder-sub').textContent = '请另一端使用相同 RoomId、不同 UserId 进房';
      }
      syncCallDuration();
      $('local-badge').textContent = state.displayName || '我';
      $('local-avatar').textContent = String(state.displayName || state.userId || '我').slice(0, 1).toUpperCase();
    }

    function setRemoteVisible(visible) {
      $('remote-placeholder').classList.toggle('hide', visible);
    }

    function waitForElement(id, timeoutMs = 4000) {
      return new Promise((resolve, reject) => {
        const existing = document.getElementById(id);
        if (existing) return resolve(existing);
        const started = Date.now();
        const timer = setInterval(() => {
          const el = document.getElementById(id);
          if (el) {
            clearInterval(timer);
            resolve(el);
          } else if (Date.now() - started >= timeoutMs) {
            clearInterval(timer);
            reject(new Error(`#${id} not found`));
          }
        }, 40);
      });
    }

    function nextFrame() {
      return new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
    }

    function fitHost(host) {
      if (!host) return;
      host.querySelectorAll('video, canvas, div').forEach((el) => {
        el.style.width = '100%';
        el.style.height = '100%';
        if (el.tagName === 'VIDEO' || el.tagName === 'CANVAS') el.style.objectFit = 'cover';
      });
    }

    function bytesToBase64(bytes) {
      const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
      let result = '';
      for (let i = 0; i < bytes.length; i += 3) {
        const a = bytes[i];
        const b = i + 1 < bytes.length ? bytes[i + 1] : 0;
        const c = i + 2 < bytes.length ? bytes[i + 2] : 0;
        const bitmap = (a << 16) | (b << 8) | c;
        result += alphabet.charAt((bitmap >> 18) & 63);
        result += alphabet.charAt((bitmap >> 12) & 63);
        result += i + 1 < bytes.length ? alphabet.charAt((bitmap >> 6) & 63) : '=';
        result += i + 2 < bytes.length ? alphabet.charAt(bitmap & 63) : '=';
      }
      return result;
    }

    function base64UrlEscape(value) {
      return value.replace(/\+/g, '*').replace(/\//g, '-').replace(/=/g, '_');
    }

    function genTestUserSig(userId, sdkAppId, secretKey, expireTime) {
      const currTime = Math.floor(Date.now() / 1000);
      const contentToBeSigned = [
        `TLS.identifier:${userId}`,
        `TLS.sdkappid:${sdkAppId}`,
        `TLS.time:${currTime}`,
        `TLS.expire:${expireTime}`,
        ''
      ].join('\n');
      const sigBytes = Uint8Array.from(sha256.hmac.array(secretKey, contentToBeSigned));
      const payload = {
        'TLS.ver': '2.0',
        'TLS.identifier': String(userId),
        'TLS.sdkappid': Number(sdkAppId),
        'TLS.expire': Number(expireTime),
        'TLS.time': Number(currTime),
        'TLS.sig': bytesToBase64(sigBytes)
      };
      const compressed = pako.deflate(JSON.stringify(payload));
      return base64UrlEscape(bytesToBase64(compressed));
    }

    async function destroyTrtc() {
      const trtc = state.trtc;
      state.trtc = null;
      if (!trtc) return;
      try { await trtc.exitRoom(); } catch {}
      try { trtc.destroy(); } catch {}
    }

    async function playRemoteVideo(userId, streamType) {
      const trtc = state.trtc;
      if (!trtc || !userId) return;
      const TRTC = window.TRTC;
      const type = streamType ?? TRTC.TYPE.STREAM_TYPE_MAIN;
      const key = `${userId}:${String(type)}`;
      if (state.startedRemoteKeys.has(key)) return;

      try {
        const view = await waitForElement('remote-video');
        await nextFrame();
        if (view.clientWidth < 2 || view.clientHeight < 2) {
          view.style.width = '100%';
          view.style.height = '100%';
          await nextFrame();
        }
        if (!state.trtc) return;
        await state.trtc.startRemoteVideo({
          userId,
          streamType: type,
          view,
          option: { fillMode: 'cover' }
        });
        state.startedRemoteKeys.add(key);
        fitHost(view);
        setRemoteVisible(true);
        toast('已接通对方画面');
      } catch (e) {
        console.error(e);
        state.startedRemoteKeys.delete(key);
        setRemoteVisible(false);
        toast(`拉取远端视频失败：${e?.message || e}`);
      }
    }

    function getTRTC() {
      return window.TRTC || null;
    }

    function loadScript(src) {
      return new Promise((resolve, reject) => {
        if (getTRTC()) return resolve();
        const absolute = new URL(src, location.href).href;
        const existed = [...document.scripts].find((s) => {
          try { return new URL(s.src, location.href).href === absolute; } catch { return s.src === src; }
        });
        if (existed) {
          // 页面里已有同地址 script（含 head 引入），等待其完成
          const started = Date.now();
          const timer = setInterval(() => {
            if (getTRTC()) {
              clearInterval(timer);
              resolve();
            } else if (Date.now() - started > 8000) {
              clearInterval(timer);
              reject(new Error(`等待超时：${src}`));
            }
          }, 50);
          existed.addEventListener('load', () => {
            if (getTRTC()) {
              clearInterval(timer);
              resolve();
            }
          }, { once: true });
          existed.addEventListener('error', () => {
            clearInterval(timer);
            reject(new Error(`加载失败：${src}`));
          }, { once: true });
          return;
        }
        const script = document.createElement('script');
        script.src = src;
        script.async = true;
        script.onload = () => resolve();
        script.onerror = () => reject(new Error(`加载失败：${src}`));
        document.head.appendChild(script);
      });
    }

    async function ensureTrtcSdk() {
      if (getTRTC()) return getTRTC();
      const sources = [
        new URL('./vendor/trtc.js', location.href).href,
        'https://unpkg.com/trtc-sdk-v5@5.20.1/trtc.js',
        'https://cdn.jsdelivr.net/npm/trtc-sdk-v5@5.20.1/trtc.js'
      ];
      let lastError = null;
      for (const src of sources) {
        try {
          await loadScript(src);
          // 少数 CDN 会晚一拍挂载全局变量
          for (let i = 0; i < 20; i++) {
            if (getTRTC()) return getTRTC();
            await new Promise((r) => setTimeout(r, 50));
          }
        } catch (e) {
          lastError = e;
        }
      }
      throw lastError || new Error('TRTC SDK 未加载');
    }

    async function bootSdk(options = {}) {
      const sdkPill = $('sdk-pill');
      const enterBtn = $('btn-enter');
      enterBtn.disabled = true;
      setLobbyStatus('joining', 'SDK 加载中');
      try {
        await ensureTrtcSdk();
        sdkPill.textContent = 'TRTC 已就绪';
        sdkPill.classList.add('ready');
        setLobbyStatus('ready', '就绪');
        setStatusText('进房前请允许摄像头与麦克风权限。双方使用相同 RoomId，UserId 不同。');
        enterBtn.disabled = false;
        if (options.autostart) {
          setStatusText('参数已就绪，正在自动进入房间…');
          void enterRoom();
        }
      } catch (e) {
        console.error(e);
        sdkPill.textContent = 'TRTC 加载失败';
        setLobbyStatus('error', '失败');
        setStatusText(`TRTC SDK 加载失败：${e?.message || e}。请检查网络后刷新页面。`);
        toast('TRTC SDK 加载失败，请刷新重试');
      }
    }

    /**
     * @param {{ rejoin?: boolean, cloudRecord?: boolean }} [options]
     * rejoin: 通话中重进房（用于开关云端录制）
     * cloudRecord: 是否携带 userDefineRecordId 开启指定用户云端录制
     */
    async function enterRoom(options = {}) {
      const rejoin = !!options.rejoin;
      const wantCloud =
        typeof options.cloudRecord === 'boolean' ? options.cloudRecord : state.cloudRecording;

      let TRTC;
      try {
        TRTC = await ensureTrtcSdk();
      } catch {
        toast('TRTC SDK 未加载，请刷新页面');
        return;
      }

      const { app: sdkAppId, seed: secretKey } = resolveAuthBundle();
      const userId = rejoin
        ? state.userId
        : String($('user-id').value || '').trim();
      const roomId = rejoin
        ? Number(state.roomId)
        : Number(String($('room-id').value || '').trim());
      const displayName = rejoin
        ? state.displayName
        : String($('display-name').value || '').trim();

      if (!sdkAppId || !secretKey) {
        toast('应用配置缺失，请检查页面内置 SDK 配置');
        return;
      }
      if (!userId || !Number.isInteger(roomId) || roomId <= 0 || roomId > 4294967294) {
        toast('请填写有效的 UserId 与数字 RoomId（1 ~ 4294967294）');
        return;
      }

      const prevMic = rejoin ? state.micOn : true;
      const prevCam = rejoin ? state.camOn : true;
      const prevSpeaker = rejoin ? state.speakerOn : true;

      if (!rejoin) {
        saveForm();
        state.userId = userId;
        state.roomId = roomId;
        state.displayName = displayName || userId;
        state.remoteUserId = '';
        state.cloudRecording = false;
        state.userDefineRecordId = '';
      }

      state.status = 'joining';
      state.startedRemoteKeys.clear();
      state.micOn = prevMic;
      state.camOn = prevCam;
      state.speakerOn = prevSpeaker;
      state.speakerMutedRef = !prevSpeaker;

      setFormLocked(true);
      setLobbyStatus('joining', rejoin ? (wantCloud ? '开启云录' : '停止云录') : '进房中');
      setStatusText(rejoin ? '正在切换云端录制状态…' : '正在进入房间并采集音视频…');
      setMicUi(prevMic);
      setCamUi(prevCam);
      setSpeakerUi(prevSpeaker);
      if (!rejoin) setRemoteVisible(false);
      updateCallHeader();
      showScreen('call');

      try {
        if (rejoin) await stopCloudMix();
        await destroyTrtc();
        if (rejoin) {
          $('remote-video').innerHTML = '';
          $('local-video').innerHTML = '';
          setRemoteVisible(false);
        }

        const userSig = genTestUserSig(userId, sdkAppId, secretKey, TRTC_DEFAULTS.expireTime);
        const trtc = TRTC.create();
        state.trtc = trtc;

        trtc.on(TRTC.EVENT.REMOTE_USER_ENTER, (event) => {
          state.remoteUserId = event.userId;
          updateCallHeader();
          toast(`${event.userId} 已加入`);
          if (state.cloudRecording) void ensureCloudMix();
        });

        trtc.on(TRTC.EVENT.REMOTE_USER_EXIT, (event) => {
          if (state.remoteUserId === event.userId) state.remoteUserId = '';
          for (const key of [...state.startedRemoteKeys]) {
            if (key.startsWith(`${event.userId}:`)) state.startedRemoteKeys.delete(key);
          }
          try {
            trtc.stopRemoteVideo?.({ userId: event.userId, streamType: TRTC.TYPE.STREAM_TYPE_MAIN });
          } catch {}
          $('remote-video').innerHTML = '';
          setRemoteVisible(false);
          updateCallHeader();
          toast(`${event.userId} 已离开`);
          if (state.cloudRecording) void ensureCloudMix();
        });

        trtc.on(TRTC.EVENT.REMOTE_VIDEO_AVAILABLE, (event) => {
          state.remoteUserId = event.userId;
          updateCallHeader();
          void playRemoteVideo(event.userId, event.streamType);
          if (state.cloudRecording) void ensureCloudMix();
        });

        trtc.on(TRTC.EVENT.REMOTE_VIDEO_UNAVAILABLE, (event) => {
          state.startedRemoteKeys.delete(`${event.userId}:${String(event.streamType)}`);
          try {
            trtc.stopRemoteVideo?.({ userId: event.userId, streamType: event.streamType });
          } catch {}
          setRemoteVisible(false);
        });

        trtc.on(TRTC.EVENT.REMOTE_AUDIO_AVAILABLE, (event) => {
          void trtc.muteRemoteAudio(event.userId, state.speakerMutedRef);
        });

        if (TRTC.EVENT.AUTOPLAY_FAILED) {
          trtc.on(TRTC.EVENT.AUTOPLAY_FAILED, (event) => {
            toast('浏览器限制了自动播放，请点击扬声器开启声音');
            setSpeakerUi(false);
            if (typeof event?.resume === 'function') {
              const once = () => {
                try { event.resume(); } catch {}
                document.removeEventListener('click', once, true);
              };
              document.addEventListener('click', once, true);
            }
          });
        }

        const enterParams = {
          roomId,
          sdkAppId,
          userId,
          userSig,
          scene: TRTC.TYPE.SCENE_RTC
        };
        if (wantCloud) {
          state.userDefineRecordId = makeCloudRecordId();
          enterParams.userDefineRecordId = state.userDefineRecordId;
        } else {
          state.userDefineRecordId = '';
        }

        await trtc.enterRoom(enterParams);

        await refreshCameras();

        const localView = await waitForElement('local-video');
        await nextFrame();
        if (prevCam) {
          await trtc.startLocalVideo({
            view: localView,
            option: getLocalVideoOption()
          });
          fitHost(localView);
        }
        syncQualityUi();

        await trtc.startLocalAudio({
          option: {
            echoCancellation: 'all',
            noiseSuppression: true,
            autoGainControl: true
          }
        });
        if (!prevMic) {
          try { await trtc.updateLocalAudio({ mute: true }); } catch {}
        }

        await trtc.muteRemoteAudio('*', !prevSpeaker);

        state.status = 'joined';
        state.cloudRecording = wantCloud;
        if (!rejoin) state.inviteToken = randomInviteToken();
        // 重进房（云端录制切换）不重置通话时长
        startCallDurationTimer({ reset: !rejoin });
        setLobbyStatus('ready', '通话中');
        setStatusText(
          wantCloud
            ? `已进入房间 ${roomId} · 云端录制中（${state.userDefineRecordId}）`
            : `已进入房间 ${roomId}。可点「邀请」复制链接给对方。`
        );
        updateCallHeader();
        syncFlipCamUi();
        syncMoreMenuLabels();
        syncRecordingBanner();
        if (state.watermarkOn) setWatermarkOn(true);
        if (!rejoin) toast('已进入房间，可邀请好友');
        void refreshCameras();
        if (wantCloud) void ensureCloudMix();
      } catch (err) {
        console.error(err);
        state.status = 'error';
        state.cloudRecording = false;
        state.userDefineRecordId = '';
        if (!rejoin) stopCallDurationTimer();
        setLobbyStatus('error', '失败');
        setStatusText(`进房失败：${err?.message || err}`);
        toast(`进房失败：${err?.message || err}`);
        await destroyTrtc();
        showScreen('lobby');
        setFormLocked(false);
        syncRecordingBanner();
        syncMoreMenuLabels();
      }
    }

    async function leaveRoom() {
      await stopLocalRecording({ silent: true });
      await stopCloudMix();
      state.cloudRecording = false;
      state.userDefineRecordId = '';
      stopCallDurationTimer();
      stopWatermarkLoop();
      await destroyTrtc();
      state.startedRemoteKeys.clear();
      state.remoteUserId = '';
      state.status = 'idle';
      $('remote-video').innerHTML = '';
      $('local-video').innerHTML = '';
      setRemoteVisible(false);
      syncFlipCamUi();
      syncRecordingBanner();
      syncMoreMenuLabels();
      setFormLocked(false);
      setLobbyStatus('ready', '就绪');
      setStatusText('已挂断。可修改参数后再次进入房间。');
      showScreen('lobby');
      toast('已挂断');
    }

    async function toggleMic() {
      if (!state.trtc || state.status !== 'joined') return;
      const next = !state.micOn;
      try {
        await state.trtc.updateLocalAudio({ mute: !next });
        setMicUi(next);
      } catch {
        toast('麦克风切换失败');
      }
    }

    async function toggleCam() {
      if (!state.trtc || state.status !== 'joined') return;
      const next = !state.camOn;
      try {
        if (next) {
          await refreshCameras();
          const view = await waitForElement('local-video');
          await state.trtc.startLocalVideo({
            view,
            option: getLocalVideoOption()
          });
          fitHost(view);
        } else {
          await state.trtc.stopLocalVideo();
        }
        setCamUi(next);
        syncFlipCamUi();
      } catch {
        toast('摄像头切换失败');
      }
    }

    async function toggleSpeaker() {
      if (!state.trtc || state.status !== 'joined') return;
      const next = !state.speakerOn;
      try {
        await state.trtc.muteRemoteAudio('*', !next);
        setSpeakerUi(next);
        if (next) toast('已开启对方声音');
      } catch {
        toast('扬声器切换失败');
      }
    }

    async function probeDevices() {
      const pill = $('device-pill');
      try {
        if (!navigator.mediaDevices?.getUserMedia) {
          pill.textContent = '无媒体设备 API';
          return;
        }
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
        stream.getTracks().forEach((t) => t.stop());
        const cams = await refreshCameras();
        pill.textContent = cams.length > 1
          ? `摄像头 ${cams.length} 个 / 麦克风可用`
          : '摄像头 / 麦克风可用';
        pill.classList.add('ready');
      } catch {
        pill.textContent = '请允许摄像头与麦克风';
      }
    }

    function bindEvents() {
      $('btn-enter').addEventListener('click', () => void enterRoom());
      $('btn-random').addEventListener('click', () => {
        $('user-id').value = randomUserId();
      });
      $('btn-invite-lobby')?.addEventListener('click', openInvitePanel);
      $('btn-more-menu').addEventListener('click', openMoreMenu);
      $('action-cancel').addEventListener('click', closeMoreMenu);
      $('action-invite').addEventListener('click', () => {
        closeMoreMenu();
        setTimeout(openInvitePanel, 180);
      });
      $('action-watermark').addEventListener('click', toggleWatermark);
      $('action-cloud-record')?.addEventListener('click', () => void toggleCloudRecording());
      $('action-record')?.addEventListener('click', () => void toggleLocalRecording());
      $('more-mask').addEventListener('click', (e) => {
        if (e.target === $('more-mask')) closeMoreMenu();
        const q = e.target.closest('[data-quality]');
        if (q) void applyVideoQuality(q.dataset.quality);
      });
      window.addEventListener('resize', () => {
        if (state.watermarkOn) drawWatermarkCanvas();
      });
      $('btn-copy-link').addEventListener('click', () => void copyInviteLink());
      $('btn-copy-text').addEventListener('click', () => void copyInviteMessage());
      $('btn-close-invite').addEventListener('click', closeInvitePanel);
      $('invite-mask').addEventListener('click', (e) => {
        if (e.target === $('invite-mask')) closeInvitePanel();
      });
      $('btn-mic').addEventListener('click', () => void toggleMic());
      $('btn-cam').addEventListener('click', () => void toggleCam());
      $('btn-flip-cam').addEventListener('click', () => void flipCamera());
      $('btn-speaker').addEventListener('click', () => void toggleSpeaker());
      $('btn-hangup').addEventListener('click', () => void leaveRoom());
      if (navigator.mediaDevices?.addEventListener) {
        navigator.mediaDevices.addEventListener('devicechange', () => {
          void refreshCameras();
        });
      }
      $('local-pip').addEventListener('click', () => {
        if (state.status === 'joined') $('screen-call').classList.toggle('swapped');
      });
      $('call-stage').addEventListener('click', () => {
        if ($('screen-call').classList.contains('swapped')) {
          $('screen-call').classList.remove('swapped');
        }
      });
      window.addEventListener('beforeunload', () => {
        if (state.trtc) {
          try { state.trtc.exitRoom(); } catch {}
          try { state.trtc.destroy(); } catch {}
        }
      });
    }

    detectBrowserEnv();
    loadForm();
    if (!QUALITY_PRESETS[state.quality]) state.quality = 'uhd';
    syncQualityUi();
    syncMoreMenuLabels();
    const inviteResult = applyInviteFromUrl();
    bindEvents();
    void bootSdk({ autostart: !!inviteResult.autostart });
    void probeDevices();
  })();
  </script>
</body>
